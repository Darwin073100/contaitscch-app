<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover: las zonas seguras del iPhone (isla, barra de inicio) llegan a la app -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, shrink-to-fit=no"
    />
    <title>%WEB_TITLE%</title>
    <!-- "Agregar a inicio" en iPhone: pantalla completa, ícono y nombre -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="CONTAITSCCH" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0F2A44" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #0f2a44;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>Activa JavaScript para usar CONTAITSCCH.</noscript>
    <div id="root"></div>
  </body>
</html>
