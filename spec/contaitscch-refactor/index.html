var CONTENT = {"levels": [{"num": 1, "title": "Fundamentos: qué es la contabilidad y para qué sirve", "meta": "Al terminar este nivel el alumno explica con sus palabras qué es la contabilidad, conoce su origen, distingue a sus usuarios y reconoce los tipos de contabilidad y las entidades económicas.", "lessons": [{"id": "N1-L1", "num": 1, "title": "¿Qué es la contabilidad?", "objective": "Definir la contabilidad y explicar por qué se le llama el lenguaje de los negocios.", "explanation": ["La contabilidad es la técnica que registra, clasifica y resume, en términos de dinero, las operaciones de un negocio o de una persona, para después interpretar los resultados. No es solo anotar números: es convertir todo lo que pasa en un negocio —compras, ventas, pagos, deudas— en información ordenada que se puede entender.", "Por eso se dice que la contabilidad es el lenguaje de los negocios. Igual que un idioma permite comunicarse, la contabilidad permite que el dueño, un banco o un socio entiendan cómo está un negocio sin estar presentes todos los días: cuánto tiene, cuánto debe, cuánto vende y si gana o pierde.", "Para que ese lenguaje funcione, toda operación debe tener un comprobante (una nota, una factura o un recibo), debe medirse en dinero y debe registrarse en orden cronológico. Una operación que no se registra es como si no hubiera pasado: nadie podrá comprobarla después."], "exampleTitle": "La papelería de Ana", "exampleSteps": ["Lunes: Ana compra cuadernos por $2,000 y paga en efectivo. Operación: salió dinero y entró mercancía.", "Martes: vende $650 en cuadernos y plumas. Operación: entró dinero y salió mercancía.", "Miércoles: paga $300 de luz. Operación: salió dinero por un gasto.", "Al final de la semana, con esos registros ordenados, Ana puede responder: ¿cuánto vendí?, ¿cuánto gasté?, ¿me quedó ganancia? Sin registros, solo tendría una impresión, no una respuesta."], "keyIdea": "Contabilidad = registrar + clasificar + resumir + interpretar. Si falta el registro, no hay información confiable.", "commonError": "Confundir contabilidad con solo guardar facturas. Guardar papeles no es contabilidad si nunca se registran, se ordenan ni se interpretan.", "activity": "Durante un día, anota en una libreta o en la app cinco operaciones de dinero de tu casa o de un negocio conocido (qué pasó, cuánto fue y si entró o salió dinero). Al final escribe una frase: ¿ese día entró o salió más dinero?", "quiz": [{"text": "¿Qué hace la contabilidad con las operaciones de un negocio?", "options": ["Las guarda en una caja sin orden", "Las registra, clasifica, resume e interpreta en términos de dinero", "Las publica en redes sociales", "Las convierte en publicidad"], "correct": 1, "feedback": "La contabilidad trabaja en cuatro pasos: registrar, clasificar, resumir e interpretar."}, {"text": "¿Por qué se dice que la contabilidad es el lenguaje de los negocios?", "options": ["Porque todos los negocios hablan igual", "Porque permite comunicar la situación económica de un negocio a quien no está en él", "Porque se aprende como un idioma extranjero", "Porque usa palabras difíciles"], "correct": 1, "feedback": "Comunica cuánto se tiene, cuánto se debe y si se gana o se pierde, sin necesidad de estar presente."}]}, {"id": "N1-L2", "num": 2, "title": "Historia de la contabilidad", "objective": "Ubicar los momentos clave de la historia contable y explicar el aporte de Luca Pacioli.", "explanation": ["La contabilidad nació por necesidad. Hace miles de años, en Mesopotamia y Egipto, los templos y comerciantes llevaban cuentas en tablillas de arcilla y papiros: cuánto grano entraba, cuánto salía y a quién se le debía. Cuando el comercio creció en las ciudades italianas del Renacimiento, esos apuntes sueltos ya no alcanzaban.", "En 1494, el fraile y matemático italiano Luca Pacioli publicó en su obra Summa de arithmetica el método de la partida doble, que ya usaban los comerciantes de Venecia. Pacioli no lo inventó, pero fue el primero en explicarlo por escrito, por eso se le conoce como el padre de la contabilidad. Su idea central sigue vigente hoy: en cada operación hay una doble cara, algo que entra y algo que sale, y ambas deben cuadrar.", "En los siglos siguientes llegaron la Revolución Industrial (las fábricas necesitaron calcular costos), las primeras leyes fiscales y, en el siglo XX, las normas profesionales. Hoy la contabilidad es electrónica: en México los registros y las facturas se llevan en sistemas y se envían al SAT (Servicio de Administración Tributaria) por medios digitales, pero la lógica de Pacioli es la misma."], "exampleTitle": "De la tablilla a la app", "exampleSteps": ["Un comerciante de 1490 anota en su libro: «debo a Marco 20 monedas por tela» y en otra página: «tengo tela que vale 20 monedas». Esa es la partida doble en acción.", "Una tienda de hoy hace lo mismo con un sistema: registra la compra de mercancía y, al mismo tiempo, la deuda con el proveedor o la salida de efectivo.", "Cambió el soporte —arcilla, papel, computadora, aplicación— pero no cambió la pregunta: ¿de dónde salió el valor y a dónde fue?"], "keyIdea": "1494, Luca Pacioli y la partida doble: el hecho histórico que marca el inicio de la contabilidad moderna.", "commonError": "Creer que Pacioli inventó la contabilidad. La contabilidad existía desde la antigüedad; Pacioli sistematizó y difundió el método de la partida doble.", "activity": "Ordena en una línea de tiempo estos hechos: facturación electrónica en México, tablillas de arcilla en Mesopotamia, publicación de Pacioli (1494) y Revolución Industrial. Escribe junto a cada uno qué problema resolvió.", "quiz": [{"text": "¿Quién es considerado el padre de la contabilidad y por qué?", "options": ["Adam Smith, por escribir sobre economía", "Luca Pacioli, por publicar en 1494 el método de la partida doble", "Un contador del SAT, por crear la factura electrónica", "Nadie, la contabilidad no tiene historia"], "correct": 1, "feedback": "Pacioli publicó en 1494 la primera explicación escrita de la partida doble."}, {"text": "¿Qué problema hizo necesaria la contabilidad desde la antigüedad?", "options": ["Decorar los templos", "Saber cuánto se tenía, cuánto salía y cuánto se debía cuando ya no alcanzaba la memoria", "Enseñar matemáticas en las escuelas", "Cobrar impuestos en monedas de oro"], "correct": 1, "feedback": "Los registros nacen cuando las operaciones son tantas que la memoria ya no basta."}]}, {"id": "N1-L3", "num": 3, "title": "¿Para quién es la información contable? Usuarios y tipos de contabilidad", "objective": "Distinguir usuarios internos y externos, y diferenciar contabilidad financiera, administrativa y fiscal.", "explanation": ["La información contable no se prepara para una sola persona. Los usuarios internos son quienes dirigen el negocio: el dueño, los gerentes y los jefes de área. La usan a diario para decidir: ¿puedo bajar un precio?, ¿alcanza para contratar a alguien?, ¿qué producto se vende más?", "Los usuarios externos están fuera del negocio, pero también deciden con esa información: un banco decide si presta dinero, un proveedor decide si vende a crédito, un inversionista decide si pone su dinero y el gobierno verifica el pago de impuestos.", "Según quién la usa y para qué, hay tres ramas principales. La contabilidad financiera resume el negocio para usuarios externos y sigue reglas formales. La contabilidad administrativa es para uso interno, no tiene formato obligatorio y mira hacia el futuro (presupuestos, costos, metas). La contabilidad fiscal se enfoca en calcular y comprobar los impuestos conforme a las leyes."], "exampleTitle": "La misma tienda, tres miradas", "exampleSteps": ["Financiera: la dueña entrega al banco un resumen del año para pedir un préstamo.", "Administrativa: la dueña compara qué día de la semana vende más para decidir su horario.", "Fiscal: la dueña calcula cuánto impuesto debe pagar por sus ventas del mes."], "keyIdea": "Internos deciden dentro del negocio; externos deciden sobre el negocio desde fuera. La rama se define por el usuario y el propósito.", "commonError": "Pensar que la contabilidad administrativa sigue el mismo formato obligatorio que la fiscal. La administrativa es libre: se diseña según lo que la dirección necesita saber.", "activity": "Clasifica como interno o externo: el dueño, el banco, un proveedor, el gerente de ventas, el SAT y un posible socio inversionista. Junto a cada uno escribe qué le interesa saber del negocio.", "quiz": [{"text": "Un banco que revisa la información de una empresa para decidir un préstamo es un usuario:", "options": ["Interno", "Externo", "Administrativo", "Fiscal"], "correct": 1, "feedback": "El banco no dirige el negocio; decide desde fuera, por eso es usuario externo."}, {"text": "¿Qué rama de la contabilidad se usa para presupuestos y decisiones internas, sin formato obligatorio?", "options": ["Fiscal", "Financiera", "Administrativa", "De auditoría"], "correct": 2, "feedback": "La contabilidad administrativa sirve a la dirección y se adapta a sus necesidades."}]}, {"id": "N1-L4", "num": 4, "title": "La entidad económica y los principios básicos", "objective": "Explicar el principio de entidad y los postulados básicos que hacen confiable la información.", "explanation": ["El principio de entidad dice algo sencillo y fundamental: el negocio es una persona distinta de su dueño. El dinero de la tienda no es el dinero de la casa, aunque la dueña sea la misma persona. Si se mezclan, ya nadie sabe si el negocio gana o si solo está pagando los gastos personales de la familia.", "En México, las Normas de Información Financiera (NIF) reúnen los postulados básicos que ordenan la contabilidad. Los más importantes para empezar son: sustancia económica (importa lo que realmente pasa, no solo la forma del papel), negocio en marcha (se registra suponiendo que la empresa seguirá operando), devengación contable (las operaciones se registran cuando ocurren, no cuando se cobra o se paga) y valuación (todo se mide en dinero, en la moneda del país).", "Estos principios no son adorno teórico: son las reglas que hacen que la información de dos negocios distintos se pueda comparar y que un banco o un socio puedan confiar en ella."], "exampleTitle": "El error de la caja única", "exampleSteps": ["Don Luis paga de la caja de su taller la colegiatura de su hijo y también las refacciones del taller, sin distinguir.", "Al fin de mes la caja está vacía y Don Luis no sabe si el taller pierde dinero o si el problema es la mezcla.", "Solución contable: aplicar la entidad. La colegiatura es un retiro personal del dueño, no un gasto del taller, y se registra aparte."], "keyIdea": "Entidad: negocio y dueño son distintos. Devengación: se registra cuando ocurre la operación, aunque el dinero se mueva después.", "commonError": "Registrar una venta solo cuando el cliente paga. Con la devengación, la venta se registra cuando se realiza; el derecho de cobro queda registrado mientras tanto.", "activity": "Lee estos casos y di qué postulado se aplica: a) vendiste hoy a crédito y el cliente pagará en 30 días; ya registras la venta. b) sacaste dinero del negocio para un gasto de tu casa; lo anotas como retiro, no como gasto. c) registras la compra de una máquina por lo que realmente costó, en pesos.", "quiz": [{"text": "Si el dueño paga un gasto personal con dinero del negocio y lo anota como gasto del negocio, ¿qué principio se rompe?", "options": ["Negocio en marcha", "Entidad económica", "Valuación", "Dualidad económica"], "correct": 1, "feedback": "El principio de entidad separa el patrimonio del dueño del patrimonio del negocio."}, {"text": "Vendes mercancía hoy y el cliente pagará dentro de un mes. Según la devengación contable, la venta se registra:", "options": ["Cuando el cliente pague", "El mes siguiente", "Hoy, cuando se realiza la operación", "Solo si hay factura en papel"], "correct": 2, "feedback": "La devengación registra las operaciones cuando ocurren, no cuando entra o sale el efectivo."}]}]}, {"num": 2, "title": "El lenguaje contable: cuentas, partida doble, cargo y abono", "meta": "Al terminar este nivel el alumno clasifica cuentas de activo, pasivo y capital, aplica la regla del cargo y el abono según la naturaleza de cada cuenta y comprueba la dualidad económica en operaciones sencillas.", "lessons": [{"id": "N2-L1", "num": 1, "title": "La cuenta y el catálogo de cuentas", "objective": "Definir qué es una cuenta, conocer sus partes y explicar la función del catálogo de cuentas.", "explanation": ["Una cuenta es el cajón donde se acumula todo lo que pasa con un mismo concepto. La cuenta Caja guarda solo movimientos de dinero en efectivo; la cuenta Clientes, solo lo que los clientes deben; la cuenta Ventas, solo lo vendido. Cada cuenta tiene un nombre, un lado izquierdo llamado Debe y un lado derecho llamado Haber. Anotar en el Debe se llama cargar; anotar en el Haber se llama abonar.", "La representación clásica de una cuenta es la cuenta T: una T mayúscula con el nombre arriba, el Debe a la izquierda y el Haber a la derecha. La diferencia entre ambos lados es el saldo. Si el Debe es mayor, el saldo es deudor; si el Haber es mayor, el saldo es acreedor.", "El catálogo de cuentas es la lista ordenada y codificada de todas las cuentas que usa un negocio, por ejemplo 101 Caja, 102 Bancos, 201 Proveedores. Es el índice de todo el sistema: sin catálogo, cada quien nombraría las cuentas a su manera y la información no se podría sumar ni comparar."], "exampleTitle": "La cuenta T de Caja", "exampleSteps": ["Debe (cargos): entró dinero por ventas $650 y por un préstamo $1,000. Total cargos: $1,650.", "Haber (abonos): salió dinero por el pago de luz $300 y por compra de mercancía $500. Total abonos: $800.", "Saldo = $1,650 − $800 = $850, saldo deudor. Interpretación: hay $850 en efectivo, y eso debe coincidir con el dinero físico de la caja."], "keyIdea": "Debe = izquierda = cargar. Haber = derecha = abonar. Saldo deudor: manda el Debe. Saldo acreedor: manda el Haber.", "commonError": "Creer que cargar significa siempre aumentar. Cargar aumenta unas cuentas y disminuye otras: depende de la naturaleza de la cuenta, como se verá en la lección N2-L3.", "activity": "Dibuja la cuenta T de Bancos con estos movimientos: depósito inicial $5,000, pago con transferencia $1,200, depósito por ventas $2,300 y retiro $600. Calcula el saldo y di si es deudor o acreedor.", "quiz": [{"text": "Anotar una cantidad en el lado izquierdo de una cuenta se llama:", "options": ["Abonar", "Cargar", "Saldar", "Cancelar"], "correct": 1, "feedback": "El lado izquierdo es el Debe; anotar ahí es cargar."}, {"text": "¿Para qué sirve el catálogo de cuentas?", "options": ["Para guardar las facturas en orden", "Es la lista ordenada y codificada de las cuentas que usa el negocio", "Para calcular impuestos", "Para diseñar el logotipo del negocio"], "correct": 1, "feedback": "El catálogo ordena y da un código único a cada cuenta del sistema."}]}, {"id": "N2-L2", "num": 2, "title": "Activo, pasivo y capital: la ecuación contable", "objective": "Clasificar bienes, derechos, obligaciones y aportaciones, y aplicar la ecuación Activo = Pasivo + Capital.", "explanation": ["Todo lo que un negocio tiene se llama activo: dinero, mercancía, muebles, equipo y también los derechos de cobro, como lo que los clientes deben. El activo responde a la pregunta ¿qué tiene el negocio y qué le deben?", "La pregunta siguiente es ¿de dónde salió eso? Solo hay dos fuentes posibles: se debe a terceros —eso es el pasivo: préstamos, deudas con proveedores, impuestos por pagar— o lo aportaron los dueños y lo ha ganado el propio negocio —eso es el capital contable—.", "De ahí nace la ecuación contable, la regla de oro de todo el sistema: Activo = Pasivo + Capital. Siempre debe cumplirse. Si un negocio tiene $100,000 en bienes y derechos y debe $40,000, la parte de los dueños es necesariamente $60,000. Toda operación mueve la ecuación, pero nunca la rompe: si un lado crece, algo del otro lado crece o el mismo lado se compensa."], "exampleTitle": "Nace una tienda", "exampleSteps": ["María aporta $50,000 de sus ahorros para abrir su tienda. Activo: Caja $50,000. Capital: $50,000. Ecuación: 50,000 = 0 + 50,000.", "El banco le presta $30,000. Activo: Bancos sube a $30,000. Pasivo: Préstamos $30,000. Ecuación: 80,000 = 30,000 + 50,000.", "Compra mercancía a crédito por $20,000. Activo: Inventarios $20,000. Pasivo: Proveedores $20,000. Ecuación: 100,000 = 50,000 + 50,000. Siempre cuadra."], "keyIdea": "Activo = Pasivo + Capital. El activo es lo que se tiene; pasivo y capital explican de dónde salió.", "commonError": "Llamar capital a todo el dinero que hay en caja. En caja puede haber dinero prestado (pasivo) o de ventas que aún deben cubrir costos; capital es solo la parte que corresponde a los dueños.", "activity": "Clasifica en activo, pasivo o capital: efectivo, deuda con el proveedor, aportación del dueño, mercancía, préstamo bancario, lo que un cliente debe, utilidades acumuladas y una computadora del negocio. Después verifica con la ecuación inventando un monto para cada uno.", "quiz": [{"text": "Una empresa tiene activos por $180,000 y pasivos por $70,000. Su capital es:", "options": ["$250,000", "$110,000", "$70,000", "No se puede saber"], "correct": 1, "feedback": "Capital = Activo − Pasivo = 180,000 − 70,000 = $110,000."}, {"text": "Lo que los clientes deben al negocio por ventas a crédito se clasifica como:", "options": ["Pasivo", "Capital", "Activo, porque es un derecho de cobro", "Gasto"], "correct": 2, "feedback": "Los derechos de cobro forman parte del activo."}]}, {"id": "N2-L3", "num": 3, "title": "Naturaleza de las cuentas y reglas del cargo y el abono", "objective": "Aplicar, según la naturaleza deudora o acreedora de cada cuenta, cuándo se carga y cuándo se abona.", "explanation": ["Cada grupo de cuentas tiene una naturaleza, es decir, un lado por el que crece. Las cuentas de activo y las de gastos y costos son de naturaleza deudora: aumentan con un cargo y disminuyen con un abono. Las cuentas de pasivo, capital e ingresos son de naturaleza acreedora: aumentan con un abono y disminuyen con un cargo.", "No hay que memorizarlo como una lista suelta: se deduce de la ecuación. Si compro mercancía al contado, el activo Inventarios aumenta (cargo) y el activo Caja disminuye (abono). Si vendo, Caja aumenta (cargo) y el ingreso Ventas aumenta (abono). El movimiento siempre toca al menos dos cuentas.", "Regla práctica para no perderse: primero pregunta qué cuentas intervienen, segundo si cada una aumenta o disminuye, y tercero aplica su naturaleza. Con esas tres preguntas se resuelve cualquier operación básica."], "exampleTitle": "Pago de renta por $4,000 con transferencia", "exampleSteps": ["Cuentas que intervienen: Gasto por renta (gasto) y Bancos (activo).", "¿Aumenta o disminuye? El gasto nace, aumenta. Bancos baja porque salió dinero.", "Aplicación: un gasto aumenta con cargo → cargo a Renta $4,000. Un activo disminuye con abono → abono a Bancos $4,000. Cargos = abonos."], "keyIdea": "Deudoras: activo, costos y gastos — crecen cargando. Acreedoras: pasivo, capital e ingresos — crecen abonando.", "commonError": "Cargar Bancos cuando sale dinero. Si el activo disminuye, se abona, aunque la palabra «abono» suene a «agregar».", "activity": "Para cada operación di qué cuentas se cargan y cuáles se abonan: a) venta en efectivo $1,000; b) pago a un proveedor $700; c) compra de equipo a crédito $9,000; d) aportación adicional del dueño $10,000 en efectivo.", "quiz": [{"text": "La cuenta de Proveedores (pasivo) aumenta cuando se anota en:", "options": ["El Debe (cargo)", "El Haber (abono)", "Ambos lados por igual", "La balanza"], "correct": 1, "feedback": "El pasivo es de naturaleza acreedora: crece con abonos."}, {"text": "Si se paga en efectivo una deuda con un proveedor, Bancos o Caja se:", "options": ["Carga, porque es un pago importante", "Abona, porque el activo disminuye", "No se mueve", "Carga y se abona a la vez"], "correct": 1, "feedback": "Al salir dinero, el activo disminuye, y un activo disminuye con un abono."}]}, {"id": "N2-L4", "num": 4, "title": "La partida doble y la dualidad económica", "objective": "Registrar operaciones sencillas por partida doble comprobando que la suma de cargos iguala la suma de abonos.", "explanation": ["La partida doble es el método que Luca Pacioli difundió y que se sigue usando: toda operación afecta al menos a dos cuentas, y la suma de los cargos siempre es igual a la suma de los abonos. No es un capricho: es la consecuencia de la dualidad económica, el postulado de que todo recurso tiene una fuente.", "Piensa en cualquier hecho de un negocio y pregúntate dos cosas: ¿qué entró o aumentó? y ¿de dónde salió o qué disminuyó? Una venta en efectivo: entra dinero (cargo a Caja) y nace un ingreso (abono a Ventas). Una compra a crédito: entra mercancía (cargo a Inventarios) y nace una deuda (abono a Proveedores). Siempre hay dos caras.", "Si al terminar un registro los cargos no igualan a los abonos, hay un error, con seguridad. La partida doble funciona así también como un mecanismo de autocontrol: el sistema avisa cuando algo se registró mal."], "exampleTitle": "Compra de mercancía por $8,000: mitad en efectivo, mitad a crédito", "exampleSteps": ["Cargo: Inventarios $8,000 (aumenta el activo).", "Abono: Caja $4,000 (disminuye el activo) y Proveedores $4,000 (aumenta el pasivo).", "Comprobación: cargos $8,000 = abonos $4,000 + $4,000 = $8,000. La operación cuadra y la ecuación se mantiene: el activo neto sube $4,000 y el pasivo sube $4,000."], "keyIdea": "En cada operación: suma de cargos = suma de abonos. Si no cuadran, hay un error.", "commonError": "Registrar solo una cara de la operación, por ejemplo anotar la venta y olvidar el ingreso o el derecho de cobro. Una sola cara rompe la ecuación y la partida doble.", "activity": "Registra por partida doble, con cuentas T o en formato de asiento: a) el dueño aporta $20,000 en efectivo; b) se compra una vitrina por $6,000 a crédito; c) se venden $3,500 en efectivo; d) se paga la mitad de la vitrina. Comprueba cada asiento.", "quiz": [{"text": "En la partida doble, en toda operación se cumple que:", "options": ["Solo se mueve una cuenta", "La suma de cargos es igual a la suma de abonos", "Todo se carga", "Todo se registra en efectivo"], "correct": 1, "feedback": "Esa igualdad es la base del método y su mecanismo de comprobación."}, {"text": "Compras equipo a crédito por $15,000. El registro correcto es:", "options": ["Cargo a Proveedores y abono a Equipo", "Cargo a Equipo y abono a Proveedores", "Cargo a Caja y abono a Equipo", "Solo se anota en el diario sin cuentas"], "correct": 1, "feedback": "Aumenta el activo Equipo (cargo) y aumenta el pasivo Proveedores (abono)."}]}]}, {"num": 3, "title": "Registro de operaciones y el ciclo contable", "meta": "Al terminar este nivel el alumno registra asientos en el libro diario, los pasa al mayor, obtiene saldos y elabora una balanza de comprobación, siguiendo las etapas del ciclo contable.", "lessons": [{"id": "N3-L1", "num": 1, "title": "El libro diario y el asiento contable", "objective": "Registrar operaciones en el libro diario con fecha, cuentas, cargos, abonos y una breve descripción.", "explanation": ["El libro diario es el registro cronológico de las operaciones: ahí se anota cada hecho el día en que ocurre, en el orden en que ocurre. Cada anotación se llama asiento contable y tiene una estructura fija: fecha, número de asiento, cuentas que se cargan, cuentas que se abonan (escritas con sangría) y un concepto breve que explica la operación.", "Por convención, en el asiento primero se escriben los cargos y después los abonos, y al final se comprueba que ambos totales sean iguales antes de darlo por terminado. El concepto no es decorativo: meses después, es lo único que explica por qué se hizo ese movimiento.", "Un asiento puede ser simple, con un cargo y un abono, o compuesto, con varias cuentas en uno o en ambos lados, como cuando una compra se paga parte en efectivo y parte a crédito."], "exampleTitle": "Asiento de una venta a crédito por $5,000", "exampleSteps": ["Fecha: 12 de marzo. Asiento 14.", "Cargo: Clientes $5,000.", "Abono: Ventas $5,000.", "Concepto: Venta de mercancía a crédito a Comercial Luna, factura 108. Cargos = abonos: el asiento está completo."], "keyIdea": "Diario = orden cronológico. Asiento = fecha + cargos + abonos + concepto, con cargos igual a abonos.", "commonError": "Escribir el asiento sin concepto o sin fecha. Sin esos datos, el registro no se puede auditar ni entender después.", "activity": "Redacta en formato de diario tres asientos: a) aportación inicial del dueño, $30,000 en efectivo; b) compra de mercancía a crédito, $7,500; c) pago de servicios (luz y agua) por $950 en efectivo, explicando en el concepto cada uno.", "quiz": [{"text": "¿Cuál es la característica principal del libro diario?", "options": ["Registra por orden alfabético", "Registra las operaciones en orden cronológico", "Solo registra ventas", "Solo se usa al final del año"], "correct": 1, "feedback": "El diario sigue el tiempo: cada operación se anota el día en que ocurre."}, {"text": "En un asiento, las cuentas que se abonan se escriben tradicionalmente:", "options": ["Antes que los cargos", "Con sangría, después de los cargos", "En otro libro", "En rojo y sin monto"], "correct": 1, "feedback": "Primero los cargos; después, con sangría, los abonos, y al final el concepto."}]}, {"id": "N3-L2", "num": 2, "title": "El libro mayor y los saldos", "objective": "Trasladar los asientos del diario al mayor y calcular el saldo de cada cuenta.", "explanation": ["El libro mayor reúne la información del diario, pero clasificada por cuenta. Pasar un asiento al mayor —a esta acción se le llama mayorizar— significa llevar cada cargo y cada abono del diario a la cuenta T que le corresponde. El diario responde ¿qué pasó cada día?; el mayor responde ¿cuánto lleva acumulado cada cuenta?", "En el mayor, cada cuenta acumula sus movimientos: la suma de sus cargos, la suma de sus abonos y su saldo. Una cuenta con solo cargos tendrá saldo deudor igual a esa suma; una cuenta de pasivo con abonos tendrá saldo acreedor.", "El mayor es el paso intermedio indispensable: de sus saldos salen la balanza de comprobación y, después, los estados financieros. Si el mayor está mal, todo lo demás estará mal."], "exampleTitle": "Mayorizando la cuenta Bancos", "exampleSteps": ["Del diario llegan: cargo $30,000 (aportación depositada), cargo $5,000 (cobro a un cliente), abono $950 (pago de servicios) y abono $7,000 (pago a proveedor).", "Total cargos: $35,000. Total abonos: $7,950.", "Saldo deudor = $35,000 − $7,950 = $27,050. Ese debe ser el dinero disponible en el banco, y debe coincidir con el estado de cuenta bancario."], "keyIdea": "Diario clasifica por fecha; mayor clasifica por cuenta. El saldo del mayor es la foto acumulada de cada cuenta.", "commonError": "Mayorizar un cargo en el lado del Haber de la cuenta. Un solo lado cambiado invierte el saldo y descuadra todo el trabajo posterior.", "activity": "Con los asientos de tu actividad de la lección N3-L1, abre las cuentas T de Caja, Inventarios, Proveedores y Capital, mayoriza cada asiento y calcula el saldo de cada cuenta.", "quiz": [{"text": "Mayorizar significa:", "options": ["Borrar el diario", "Trasladar los cargos y abonos del diario a las cuentas del mayor", "Sumar solo las ventas", "Cerrar el negocio"], "correct": 1, "feedback": "Mayorizar es pasar cada movimiento del diario a su cuenta correspondiente en el mayor."}, {"text": "En el mayor, la cuenta de un préstamo bancario normalmente presentará saldo:", "options": ["Deudor", "Cero", "Acreedor, porque el pasivo crece con abonos", "Negativo en Caja"], "correct": 2, "feedback": "El pasivo es de naturaleza acreedora: su saldo normal aparece en el Haber."}]}, {"id": "N3-L3", "num": 3, "title": "La balanza de comprobación", "objective": "Elaborar una balanza de comprobación y explicar qué errores detecta y cuáles no.", "explanation": ["La balanza de comprobación es una lista de todas las cuentas del mayor con sus saldos, colocados en dos columnas: saldos deudores y saldos acreedores. Si el trabajo se hizo bien, la suma de ambas columnas debe ser exactamente igual, porque cada operación se registró por partida doble.", "La balanza es una prueba, no un estado financiero: sirve para comprobar la igualdad aritmética y para tener, en un solo lugar, todos los saldos desde los cuales se prepararán los estados financieros.", "Hay errores que la balanza no detecta: omitir por completo una operación (no hay cargos ni abonos, y sigue cuadrando), registrar una operación dos veces, cargar una cuenta equivocada pero del mismo grupo, o registrar un monto incorrecto en ambos lados. La balanza cuadra la forma, no garantiza que el fondo esté bien."], "exampleTitle": "Balanza sencilla al 31 de marzo", "exampleSteps": ["Saldos deudores: Caja $2,000; Bancos $18,000; Inventarios $12,000; Equipo $10,000. Total deudores: $42,000.", "Saldos acreedores: Proveedores $7,000; Préstamo bancario $15,000; Capital $20,000. Total acreedores: $42,000. Totales iguales: la balanza comprueba.", "Si los totales difirieran por $100, habría que buscar: un asiento sin cuadrar, una mayorización en el lado contrario o una suma mal hecha."], "keyIdea": "Balanza: total de saldos deudores = total de saldos acreedores. Comprueba la igualdad, no la exactitud de cada operación.", "commonError": "Presentar la balanza de comprobación a un banco como si fuera un estado financiero. Es un papel de trabajo interno; los estados financieros se preparan a partir de ella.", "activity": "Con los saldos de tu mayor de la actividad anterior, arma la balanza de comprobación en dos columnas y verifica la igualdad. Después omite a propósito un asiento completo y comprueba que la balanza sigue cuadrando: escribe por qué ocurre eso.", "quiz": [{"text": "Si la balanza de comprobación no cuadra, significa que:", "options": ["El negocio perdió dinero", "Hay al menos un error de registro, de mayorización o de suma", "Se debe pagar más impuestos", "Hay que cerrar las cuentas"], "correct": 1, "feedback": "La desigualdad entre columnas siempre revela un error de procedimiento."}, {"text": "¿Cuál de estos errores NO detecta la balanza de comprobación?", "options": ["Un asiento con cargos distintos a los abonos", "Una mayorización puesta en el lado contrario", "Omitir por completo el registro de una operación", "Una suma mal hecha en una cuenta"], "correct": 2, "feedback": "Si la operación nunca se registró, no hay cargos ni abonos que descuadren: la balanza sigue en igualdad."}]}, {"id": "N3-L4", "num": 4, "title": "El ciclo contable completo", "objective": "Ordenar las etapas del ciclo contable desde el comprobante hasta los estados financieros y el cierre.", "explanation": ["Todo el trabajo contable de un periodo sigue un ciclo que se repite cada mes o cada año. Empieza con la documentación fuente: facturas, notas, recibos y estados de cuenta que comprueban que la operación existió. Sin documento, no hay registro válido.", "Después vienen, en orden: el análisis de la operación (qué cuentas se afectan y cómo), el registro en el libro diario, la mayorización, la balanza de comprobación, los ajustes necesarios (por ejemplo, reconocer gastos ya ocurridos aún no pagados), la balanza ajustada, la elaboración de los estados financieros y, al cierre del periodo, los asientos de cierre que dejan las cuentas de ingresos y gastos en cero para empezar el siguiente periodo.", "Conocer el ciclo completo evita el error más común del principiante: querer saltar del comprobante directo al estado financiero. Cada etapa alimenta a la siguiente, y un error temprano se arrastra hasta el final."], "exampleTitle": "El ciclo en un mes de una tienda", "exampleSteps": ["1 al 30: se juntan facturas y notas (documentos fuente) y se analiza cada operación.", "Cada día: se registra en el diario. Cada semana: se mayoriza.", "31 de mes: balanza de comprobación; se ajusta, por ejemplo, la renta del local que corresponde al mes.", "Inicio del mes siguiente: con la balanza ajustada se preparan los estados financieros del mes y se decide con información real."], "keyIdea": "Orden del ciclo: documento → análisis → diario → mayor → balanza → ajustes → estados financieros → cierre.", "commonError": "Hacer los estados financieros antes de los ajustes. Sin ajustes, gastos e ingresos quedan en el periodo equivocado y el resultado sale falso.", "activity": "Te dan estas etapas desordenadas: estados financieros, registro en diario, ajustes, documentos fuente, mayor, balanza de comprobación, cierre y análisis. Ordénalas, numéralas y escribe en una frase qué se obtiene al terminar cada una.", "quiz": [{"text": "¿Cuál es la primera etapa del ciclo contable?", "options": ["La balanza de comprobación", "Reunir y analizar la documentación fuente", "El cierre de cuentas", "El estado de resultados"], "correct": 1, "feedback": "Sin comprobantes no hay nada válido que registrar: el ciclo empieza en los documentos."}, {"text": "Los asientos de cierre sirven para:", "options": ["Pagar los impuestos del año", "Dejar en cero las cuentas de ingresos y gastos al terminar el periodo", "Abrir una cuenta bancaria", "Corregir la balanza"], "correct": 1, "feedback": "El cierre traslada el resultado al capital y reinicia las cuentas de resultados para el siguiente periodo."}]}]}, {"num": 4, "title": "Estados financieros", "meta": "Al terminar este nivel el alumno elabora e interpreta el balance general y el estado de resultados, distingue ingresos, costos y gastos, y conoce el estado de flujo de efectivo y el estado de cambios en el capital contable.", "lessons": [{"id": "N4-L1", "num": 1, "title": "Ingresos, costos y gastos: no es lo mismo", "objective": "Diferenciar ingreso, costo y gasto, y calcular la utilidad bruta de una operación de venta.", "explanation": ["Un ingreso es el valor que el negocio gana por su actividad principal: vender mercancía o prestar un servicio. El monto de la venta es ingreso, pero no todo es ganancia, porque vender costó algo.", "El costo de ventas es lo que costó la mercancía que se vendió o el servicio que se prestó. Si un pantalón se vende en $600 y al negocio le costó $350, la utilidad bruta de esa venta es $250. El costo está atado directamente a lo vendido: si no hay venta, no hay costo de ventas.", "Los gastos son erogaciones necesarias para operar, pero no atadas a una venta en particular: renta, luz, sueldos administrativos, publicidad y papelería. Se pagan se venda o no se venda. Orden correcto para pensar: Ingresos − Costo de ventas = Utilidad bruta; Utilidad bruta − Gastos = Utilidad de operación."], "exampleTitle": "Un día en la tienda de ropa", "exampleSteps": ["Ventas del día (ingresos): $6,000.", "Lo que costó la ropa vendida (costo de ventas): $3,600. Utilidad bruta: $6,000 − $3,600 = $2,400.", "Gastos del día (renta prorrateada, luz, sueldo): $1,500. Utilidad de operación del día: $2,400 − $1,500 = $900."], "keyIdea": "El costo nace con la venta; el gasto nace con la operación diaria, se venda o no.", "commonError": "Registrar como gasto toda la compra de mercancía. La compra no vendida es inventario (activo); solo se vuelve costo la parte que efectivamente se vendió.", "activity": "Clasifica como ingreso, costo o gasto: venta de un servicio, la tela usada en un vestido vendido, la renta del local, la publicidad del mes, el sueldo de la vendedora, la venta de mercancía y el material consumido en un servicio cobrado.", "quiz": [{"text": "La utilidad bruta se obtiene de:", "options": ["Ingresos − gastos", "Ingresos − costo de ventas", "Activo − pasivo", "Ventas + inventario"], "correct": 1, "feedback": "Primero se restan los costos directos de lo vendido: Ingresos − Costo de ventas = Utilidad bruta."}, {"text": "La renta del local, que se paga se venda o no, es un:", "options": ["Costo de ventas", "Ingreso", "Gasto de operación", "Activo"], "correct": 2, "feedback": "La renta sostiene la operación, pero no depende de una venta específica: es un gasto."}]}, {"id": "N4-L2", "num": 2, "title": "El estado de resultados", "objective": "Elaborar un estado de resultados básico e interpretar si el negocio ganó o perdió en un periodo.", "explanation": ["El estado de resultados es la película de un periodo —un mes, un trimestre, un año—: muestra los ingresos, resta el costo y los gastos, y llega al resultado final: utilidad neta si los ingresos alcanzaron y sobró, o pérdida neta si no alcanzaron. Su pregunta central es: ¿el negocio ganó o perdió, y por qué?", "Su estructura desciende por escalones: ventas netas, menos costo de ventas, igual utilidad bruta; menos gastos de operación, igual utilidad de operación; se consideran después otros ingresos y gastos y los impuestos, y se llega a la utilidad o pérdida neta del periodo.", "Cada escalón cuenta una parte de la historia. Una utilidad bruta sana con pérdida final indica que el problema no es el precio ni el costo, sino los gastos. Leer el estado por escalones es lo que permite diagnosticar, no solo saber el resultado."], "exampleTitle": "Estado de resultados de marzo, papelería", "exampleSteps": ["Ventas netas: $48,000. Costo de ventas: $29,000. Utilidad bruta: $19,000.", "Gastos de operación: renta $5,000, sueldos $7,000, luz y servicios $1,800, papelería y otros $700. Total: $14,500.", "Utilidad de operación y, en este ejemplo sin otros conceptos ni impuestos, utilidad neta del mes: $19,000 − $14,500 = $4,500. El negocio sí ganó en marzo."], "keyIdea": "Estado de resultados = periodo (película). Responde si se ganó o se perdió entre dos fechas.", "commonError": "Incluir en el estado de resultados las cuentas del balance, como Caja o Proveedores. Ahí solo van ingresos, costos y gastos del periodo.", "activity": "Elabora el estado de resultados de un mes con estos datos: ventas $72,000, costo de ventas $43,200, renta $6,000, sueldos $9,500, servicios $2,100 y publicidad $900. Di cuál es la utilidad bruta, la de operación y dónde convendría recortar si se quisiera mejorar el resultado.", "quiz": [{"text": "El estado de resultados cubre:", "options": ["Una fecha exacta", "Un periodo de tiempo", "Solo un día", "El historial desde que nació la empresa en una sola cifra"], "correct": 1, "feedback": "Es la película del periodo: ingresos y egresos entre dos fechas."}, {"text": "Ventas $50,000, costo $30,000 y gastos $12,000. La utilidad neta (sin otros conceptos) es:", "options": ["$32,000", "$20,000", "$8,000", "$68,000"], "correct": 2, "feedback": "50,000 − 30,000 = 20,000 de utilidad bruta; 20,000 − 12,000 = $8,000."}]}, {"id": "N4-L3", "num": 3, "title": "El balance general o estado de situación financiera", "objective": "Elaborar un balance general básico, ordenar activo circulante y no circulante, y verificar la ecuación contable.", "explanation": ["El balance general, también llamado estado de situación financiera, es la foto del negocio en una fecha exacta: muestra el activo (lo que tiene), el pasivo (lo que debe) y el capital contable (lo que corresponde a los dueños) en ese día. Su pregunta central es: ¿qué tiene el negocio, cuánto debe y cuánto es realmente de los dueños?", "El activo se ordena por disponibilidad. El activo circulante se convierte en dinero en menos de un año: caja, bancos, clientes e inventarios. El activo no circulante dura más de un año: equipo, mobiliario, vehículos y locales. El pasivo también se ordena por vencimiento: circulante, si se paga en menos de un año (proveedores, préstamos cortos, impuestos por pagar), y no circulante, a más de un año.", "El balance siempre debe cumplir la ecuación: total activo = total pasivo + capital contable. De hecho, su nombre viene de esa balanza: si no cuadra, hay un error en los registros anteriores."], "exampleTitle": "Balance al 31 de marzo", "exampleSteps": ["Activo circulante: Caja $2,000, Bancos $18,000, Inventarios $12,000. Subtotal: $32,000. Activo no circulante: Equipo $10,000. Total activo: $42,000.", "Pasivo circulante: Proveedores $7,000. Pasivo no circulante: Préstamo bancario $15,000. Total pasivo: $22,000.", "Capital contable: $20,000. Comprobación: $42,000 = $22,000 + $20,000. El balance cuadra."], "keyIdea": "Balance = foto a una fecha. Activo circulante: vence o se usa en menos de un año; no circulante: más de un año.", "commonError": "Clasificar el inventario como activo no circulante. La mercancía está destinada a venderse en el corto plazo: es circulante.", "activity": "Clasifica y ordena en un balance: bancos $25,000, proveedores $9,000, equipo de cómputo $18,000, clientes $6,500, préstamo a 3 años $30,000, caja $3,500, inventarios $14,000 y capital $28,000. Suma cada grupo, verifica la ecuación y escribe qué haría falta si no cuadra.", "quiz": [{"text": "El balance general muestra la situación del negocio:", "options": ["Durante todo el año, día por día", "A una fecha determinada", "Solo cuando hay utilidades", "Antes de iniciar operaciones"], "correct": 1, "feedback": "Es una foto a una fecha: activo, pasivo y capital en ese día."}, {"text": "Una deuda que se pagará dentro de 3 años es un pasivo:", "options": ["Circulante", "No circulante", "Inexistente hasta que venza", "Capital contable"], "correct": 1, "feedback": "Vence a más de un año, por lo que se clasifica como pasivo no circulante."}]}, {"id": "N4-L4", "num": 4, "title": "Flujo de efectivo y cambios en el capital contable", "objective": "Explicar por qué un negocio puede tener utilidad y quedarse sin efectivo, y cómo cambia el capital de un periodo a otro.", "explanation": ["El estado de flujo de efectivo explica cómo se movió el dinero real —caja y bancos— durante un periodo, clasificado en tres actividades: operación (cobros y pagos del negocio diario), inversión (compra o venta de equipo y otros bienes duraderos) y financiamiento (préstamos recibidos o pagados, aportaciones y retiros de los dueños).", "Este estado resuelve una aparente contradicción: un negocio puede vender mucho, tener utilidad en papel y quedarse sin dinero. La causa típica es vender a crédito: la utilidad ya se registró, pero el efectivo aún está en manos de los clientes. Utilidad y efectivo no son lo mismo, y confundirlos es causa frecuente de quiebra de negocios pequeños.", "El estado de cambios en el capital contable, por su parte, explica cómo pasó el capital de un saldo inicial a uno final: aportaciones nuevas, utilidades del periodo que aumentan el capital, pérdidas que lo disminuyen y retiros de los dueños que también lo reducen."], "exampleTitle": "Utilidad sí, efectivo no", "exampleSteps": ["La tienda vendió en el mes $60,000, todo a crédito a 30 días, y su utilidad fue de $10,000.", "Pero pagó en efectivo renta y sueldos por $18,000. Entradas de efectivo por ventas: $0 todavía.", "Flujo de operación del mes: negativo, aunque el estado de resultados muestra utilidad. La lección: hay que vigilar los cobros, no solo las ventas."], "keyIdea": "Utilidad no es efectivo. El flujo de efectivo sigue el dinero; el estado de resultados sigue los ingresos y egresos devengados.", "commonError": "Repartir como ganancia todo lo que hay en caja. Parte de ese efectivo puede ser de préstamos o estar comprometido para pagar proveedores e impuestos.", "activity": "Clasifica cada movimiento como actividad de operación, inversión o financiamiento: cobro a un cliente, pago de sueldos, compra de una computadora, préstamo recibido del banco, aportación del dueño, pago del préstamo y pago a un proveedor.", "quiz": [{"text": "Un negocio con utilidad puede quedarse sin efectivo principalmente cuando:", "options": ["Vende a crédito y aún no cobra, pero ya pagó sus gastos", "Tiene demasiado inventario bonito", "Su balance cuadra", "Contrata a un contador"], "correct": 0, "feedback": "La utilidad se registra al vender; el efectivo llega cuando el cliente paga."}, {"text": "Comprar una maquinaria pagando de bancos se clasifica en el flujo de efectivo como actividad de:", "options": ["Operación", "Inversión", "Financiamiento", "No se clasifica"], "correct": 1, "feedback": "Comprar bienes duraderos para el negocio es una actividad de inversión."}]}]}, {"num": 5, "title": "Aplicación práctica: el negocio real en México", "meta": "Al terminar este nivel el alumno controla inventarios con un método sencillo, calcula la depreciación de un activo, identifica los conceptos básicos de una nómina y reconoce el IVA y el ISR en operaciones cotidianas. Los temas fiscales se presentan de forma introductoria y general.", "lessons": [{"id": "N5-L1", "num": 1, "title": "Inventarios y costo de ventas", "objective": "Calcular el costo de ventas con la fórmula de inventarios y comparar los métodos PEPS y promedio ponderado de forma básica.", "explanation": ["El inventario es la mercancía disponible para venderse. Controlarlo importa por dos razones: saber cuánto cuesta lo que se vendió (el costo de ventas) y detectar faltantes, robos o mercancía dañada comparando el registro con el conteo físico.", "La fórmula central es: Costo de ventas = Inventario inicial + Compras netas − Inventario final. Si al inicio había $10,000, se compraron $25,000 y al final quedan $8,000, lo que se vendió costó $27,000. Lo que no está en el almacén ni se devolvió, se vendió… o se perdió, y el conteo físico es lo que permite distinguirlo.", "Cuando el precio de compra cambia, hay que decidir qué costo se asigna a lo vendido. En el método PEPS (primeras entradas, primeras salidas) se supone que sale primero lo más antiguo. En el promedio ponderado, todas las unidades comparten un costo promedio. Ambos son aceptados; lo importante es aplicar uno solo de manera consistente."], "exampleTitle": "Costo promedio en una tiendita", "exampleSteps": ["Se compran 10 productos a $100 cada uno y después 10 más a $120 cada uno. Costo total: $2,200 entre 20 unidades.", "Costo promedio por unidad: $2,200 ÷ 20 = $110.", "Si se venden 12 unidades, el costo de ventas es 12 × $110 = $1,320, y quedan 8 unidades valuadas en $880."], "keyIdea": "Costo de ventas = Inventario inicial + Compras − Inventario final. El conteo físico verifica lo que dice el papel.", "commonError": "No contar el inventario final y «estimarlo». Un inventario final inflado reduce el costo de ventas y muestra una utilidad que no existe.", "activity": "Calcula el costo de ventas: inventario inicial $15,000, compras $40,000, devoluciones sobre compras $2,000 e inventario final $11,000. Después explica qué pasaría con la utilidad si el inventario final se hubiera contado mal, en $16,000.", "quiz": [{"text": "Con inventario inicial de $10,000, compras de $25,000 e inventario final de $8,000, el costo de ventas es:", "options": ["$43,000", "$27,000", "$17,000", "$8,000"], "correct": 1, "feedback": "10,000 + 25,000 − 8,000 = $27,000."}, {"text": "El método PEPS supone que la mercancía que sale primero es:", "options": ["La más cara", "La más nueva", "La primera que entró", "La dañada"], "correct": 2, "feedback": "PEPS: primeras entradas, primeras salidas."}]}, {"id": "N5-L2", "num": 2, "title": "Depreciación de activos fijos", "objective": "Explicar por qué se deprecia un activo y calcular la depreciación anual y mensual por el método de línea recta.", "explanation": ["Un equipo de cómputo, un vehículo o una maquinaria no se gastan en un solo día: sirven durante varios años, pero con el uso y el tiempo pierden valor. La depreciación es el reparto ordenado de ese costo entre los años de vida útil del bien, para reconocer en cada periodo el gasto que corresponde.", "En el método de línea recta, el más sencillo y usado para aprender: Depreciación anual = (Costo del bien − Valor de desecho) ÷ Años de vida útil. El valor de desecho es lo que se estima que valdrá el bien al final de su vida útil; muchas veces, para simplificar, se toma como cero.", "La depreciación es un gasto que no implica salida de dinero en ese momento: el dinero salió cuando se compró el bien. Por eso se le llama un cargo virtual, y por eso un negocio puede tener ese gasto registrado y, aun así, tener efectivo en caja."], "exampleTitle": "Una computadora de $18,000 con vida útil de 3 años", "exampleSteps": ["Depreciación anual = $18,000 ÷ 3 = $6,000 por año.", "Depreciación mensual = $6,000 ÷ 12 = $500 por mes.", "Al final del primer año, la depreciación acumulada es $6,000 y el valor en libros del equipo es $18,000 − $6,000 = $12,000."], "keyIdea": "Línea recta: costo entre años de vida útil. La depreciación es gasto sin salida de efectivo en el periodo.", "commonError": "Registrar toda la compra del equipo como gasto del mes de la compra. Eso hunde el resultado de un mes y deja sin gasto a los demás, aunque el equipo se use en todos.", "activity": "Un repartidor compra una motocicleta de trabajo por $48,000 con vida útil estimada de 4 años y valor de desecho de $0. Calcula la depreciación anual y mensual, y el valor en libros al terminar el segundo año.", "quiz": [{"text": "Un bien costó $30,000, con vida útil de 5 años y sin valor de desecho. Su depreciación anual en línea recta es:", "options": ["$30,000", "$6,000", "$5,000", "$15,000"], "correct": 1, "feedback": "30,000 ÷ 5 = $6,000 por año."}, {"text": "La depreciación de cada mes representa:", "options": ["Una salida de efectivo mensual al proveedor", "Un gasto del periodo sin salida de efectivo en ese momento", "Un ingreso del negocio", "Un impuesto municipal"], "correct": 1, "feedback": "El desembolso ocurrió al comprar el bien; la depreciación solo distribuye su costo."}]}, {"id": "N5-L3", "num": 3, "title": "Nómina básica: lo que se paga y lo que se retiene", "objective": "Identificar percepciones, deducciones y el sueldo neto, y registrar de forma sencilla el gasto de personal.", "explanation": ["La nómina es el documento donde se calcula lo que se paga a cada trabajador. Su lógica es una resta ordenada: primero se suman las percepciones —sueldo, horas extra, bonos y otras prestaciones en dinero— y a ese total se le restan las deducciones.", "Las deducciones típicas son las retenciones que el patrón hace por cuenta del trabajador y entrega a las autoridades o instituciones, como el impuesto sobre la renta (ISR) de sueldos y las cuotas al seguro social. El resultado de percepciones menos deducciones es el sueldo neto: lo que efectivamente recibe el trabajador.", "Para la contabilidad, el gasto del negocio no es solo el neto: es el total de percepciones más las cuotas y aportaciones que corresponden al patrón. Registrar únicamente «lo que salió de la caja» subestima el costo real de tener personal. Esta lección es introductoria: el cálculo oficial de una nómina sigue tablas y disposiciones vigentes que deben consultarse en cada periodo."], "exampleTitle": "Una quincena simplificada", "exampleSteps": ["Percepciones: sueldo quincenal $6,000 + bono $500 = $6,500.", "Deducciones (ejemplo didáctico): ISR retenido $550 y cuota al seguro social $320. Total deducciones: $870.", "Sueldo neto a pagar: $6,500 − $870 = $5,630. Las retenciones no desaparecen: el negocio las debe enterar a quien corresponda, por eso quedan como un pasivo hasta que se pagan."], "keyIdea": "Percepciones − Deducciones = Sueldo neto. Lo retenido es dinero del trabajador que el negocio guarda temporalmente: es un pasivo, no un ingreso.", "commonError": "Quedarse con las retenciones como si fueran del negocio o registrarlas como ingreso. Deben enterarse; mientras tanto, son una obligación.", "activity": "Calcula el neto de un trabajador con percepciones de $8,200, ISR retenido de $740 y cuota de seguro social de $410. Después escribe el asiento sencillo: cargo a gasto de sueldos, abonos a impuestos por pagar, cuotas por pagar y bancos.", "quiz": [{"text": "Si las percepciones son $7,000 y las deducciones $950, el sueldo neto es:", "options": ["$7,950", "$6,050", "$950", "$7,000"], "correct": 1, "feedback": "7,000 − 950 = $6,050 es lo que recibe el trabajador."}, {"text": "El ISR retenido al trabajador, antes de enterarse, se clasifica para el negocio como:", "options": ["Ingreso", "Activo", "Pasivo (impuestos por pagar)", "Capital"], "correct": 2, "feedback": "Es dinero ajeno que el negocio debe entregar: una obligación."}]}, {"id": "N5-L4", "num": 4, "title": "Impuestos básicos en México: IVA e ISR (introducción)", "objective": "Distinguir el IVA trasladado del IVA acreditable y explicar, en forma general, cómo se determina un pago de ISR.", "explanation": ["El Impuesto al Valor Agregado (IVA) grava el consumo. En términos generales, la tasa general en México es del 16 %. El negocio cobra IVA en sus ventas —IVA trasladado— y paga IVA en muchas de sus compras relacionadas con su actividad —IVA acreditable—. Periódicamente compara ambos: si trasladó más de lo que puede acreditar, paga la diferencia al SAT; si acreditó más, puede tener saldo a favor, conforme a las reglas vigentes.", "Por eso se dice que el IVA no es ingreso del negocio: es un impuesto que el consumidor final paga y que el negocio solo recauda y entera. Contar el IVA cobrado como si fuera ganancia es un error que se paga caro al momento de declarar.", "El Impuesto Sobre la Renta (ISR) grava las ganancias o ingresos, según el régimen fiscal de cada contribuyente. En forma general, se calcula aplicando la tasa o tarifa que marca la ley a la base que resulta de restar, de los ingresos, las deducciones autorizadas, y se entera con pagos provisionales y una declaración anual. Esta lección solo ubica los conceptos: los montos, tasas por régimen y procedimientos vigentes deben verificarse siempre en las disposiciones oficiales del periodo correspondiente."], "exampleTitle": "IVA de un mes, ejemplo didáctico con tasa general del 16 %", "exampleSteps": ["Ventas del mes sin IVA: $50,000. IVA trasladado cobrado a clientes: $50,000 × 16 % = $8,000.", "Compras y gastos con IVA acreditable: base $30,000. IVA pagado a proveedores: $30,000 × 16 % = $4,800.", "IVA por pagar del mes: $8,000 − $4,800 = $3,200. Esa diferencia se entera al SAT; nunca fue dinero del negocio."], "keyIdea": "IVA por pagar = IVA trasladado − IVA acreditable. ISR: grava la ganancia o los ingresos según el régimen, no el dinero total que pasa por la caja.", "commonError": "Sumar el IVA cobrado a las ventas como si fuera ingreso propio. La venta es el importe sin IVA; el impuesto se registra aparte, como una obligación.", "activity": "Con tasa general del 16 %, calcula el IVA por pagar de un mes con ventas sin IVA de $80,000 y compras y gastos acreditables sin IVA de $45,000. Después explica, en dos líneas, por qué ese IVA no es ganancia.", "quiz": [{"text": "El IVA que un negocio cobra en sus ventas se llama:", "options": ["IVA acreditable", "IVA trasladado", "ISR", "IVA a favor siempre"], "correct": 1, "feedback": "Trasladado es el que se cobra al cliente; acreditable es el que se paga en compras de la actividad."}, {"text": "Si el IVA trasladado es $10,000 y el acreditable es $6,500, el IVA por pagar es:", "options": ["$16,500", "$6,500", "$3,500", "$0"], "correct": 2, "feedback": "10,000 − 6,500 = $3,500 se entera al SAT."}]}]}, {"num": 6, "title": "Análisis, decisiones y contabilidad responsable", "meta": "Al terminar este nivel el alumno interpreta razones financieras sencillas, calcula el punto de equilibrio de un negocio pequeño y explica la importancia de la ética y de la contabilidad electrónica en México.", "lessons": [{"id": "N6-L1", "num": 1, "title": "Razones financieras básicas", "objective": "Calcular e interpretar liquidez corriente, endeudamiento y margen de utilidad neta.", "explanation": ["Una razón financiera es una división entre dos cifras de los estados financieros que, sola, dice poco, pero comparada —con meses anteriores o con el promedio del giro— dice mucho. Un número aislado no diagnostica; la comparación sí.", "Tres razones para empezar. Liquidez corriente = Activo circulante ÷ Pasivo circulante: mide si lo que se puede convertir pronto en dinero alcanza para pagar lo que vence pronto; un resultado mayor que 1 indica que sí alcanza, al menos en papel. Endeudamiento = Pasivo total ÷ Activo total: muestra qué parte de los bienes se financió con deuda. Margen neto = Utilidad neta ÷ Ventas: indica cuántos centavos de ganancia quedan por cada peso vendido.", "Interpretar no es solo calcular: hay que preguntar a qué se debe el resultado y si la tendencia mejora o empeora. Una liquidez alta con inventarios que no se venden, por ejemplo, puede esconder un problema."], "exampleTitle": "Diagnóstico rápido de una tienda", "exampleSteps": ["Activo circulante $60,000 y pasivo circulante $40,000. Liquidez = 60,000 ÷ 40,000 = 1.5. Puede cubrir sus deudas cortas 1.5 veces.", "Pasivo total $70,000 y activo total $140,000. Endeudamiento = 50 %. La mitad de los bienes se financió con deuda.", "Utilidad neta $9,000 y ventas $150,000. Margen neto = 6 %. De cada peso vendido quedan 6 centavos de ganancia."], "keyIdea": "Razón sin comparación es solo un número. Compara contra periodos anteriores y contra el giro del negocio.", "commonError": "Concluir que una liquidez muy alta siempre es buena. Demasiado dinero detenido en inventario o en caja puede significar recursos sin aprovechar.", "activity": "Con activo circulante de $85,000, pasivo circulante de $50,000, pasivo total de $95,000, activo total de $190,000, ventas de $220,000 y utilidad neta de $17,600, calcula las tres razones de la lección y escribe una conclusión de una línea para cada una.", "quiz": [{"text": "La liquidez corriente se calcula como:", "options": ["Pasivo total ÷ activo total", "Activo circulante ÷ pasivo circulante", "Utilidad ÷ ventas", "Ventas ÷ costos"], "correct": 1, "feedback": "Compara lo que pronto será dinero contra lo que pronto hay que pagar."}, {"text": "Un margen neto del 5 % significa que:", "options": ["Se debe el 5 % del negocio", "Por cada peso vendido quedan 5 centavos de utilidad neta", "El 5 % de la mercancía se perdió", "Las ventas crecieron 5 %"], "correct": 1, "feedback": "Margen neto = utilidad neta entre ventas: es la ganancia que queda por peso vendido."}]}, {"id": "N6-L2", "num": 2, "title": "Punto de equilibrio: cuánto hay que vender para no perder", "objective": "Separar costos fijos y variables y calcular el punto de equilibrio en pesos y en unidades.", "explanation": ["Los costos fijos no cambian aunque se venda mucho o poco: renta, sueldos base y servicios fijos. Los costos variables cambian con las ventas: la mercancía, los insumos por pieza y las comisiones. La diferencia entre el precio de venta y el costo variable por unidad se llama margen de contribución: es lo que cada venta aporta, primero para cubrir los fijos y después para generar utilidad.", "El punto de equilibrio es el nivel de ventas donde el negocio ni gana ni pierde: las ventas alcanzan justo para cubrir costos variables y fijos. Fórmula en unidades: Costos fijos totales ÷ Margen de contribución por unidad. Fórmula en pesos: Costos fijos ÷ (Margen de contribución ÷ Precio), o directamente fijos entre el porcentaje de margen.", "Saber este número cambia las decisiones: dice cuántas unidades mínimas hay que vender al mes, si un descuento es viable y si un nuevo gasto fijo (otro empleado, un local más grande) es sostenible."], "exampleTitle": "Una cafetería pequeña", "exampleSteps": ["Precio por bebida: $50. Costo variable por bebida: $30. Margen de contribución: $20 por bebida.", "Costos fijos del mes: renta, sueldos y servicios por $20,000.", "Punto de equilibrio: $20,000 ÷ $20 = 1,000 bebidas al mes. Vendiendo la número 1,001 empieza la utilidad. En pesos: 1,000 × $50 = $50,000 de ventas mínimas."], "keyIdea": "Punto de equilibrio = Fijos ÷ Margen de contribución. Abajo de ese punto se pierde; arriba, se gana.", "commonError": "Dividir los costos fijos entre el precio de venta, olvidando restar el costo variable. Cada unidad vendida también cuesta, y eso debe salir primero del precio.", "activity": "Un taller vende un servicio a $400 con costo variable de $250 por servicio y costos fijos mensuales de $30,000. Calcula el margen de contribución, el punto de equilibrio en servicios y en pesos, y qué pasa si suma un gasto fijo nuevo de $6,000.", "quiz": [{"text": "Con costos fijos de $12,000 y margen de contribución de $40 por unidad, el punto de equilibrio es:", "options": ["300 unidades", "480 unidades", "12,040 unidades", "40 unidades"], "correct": 0, "feedback": "12,000 ÷ 40 = 300 unidades."}, {"text": "La renta del local es un ejemplo clásico de:", "options": ["Costo variable", "Ingreso", "Costo fijo", "Costo de ventas unitario"], "correct": 2, "feedback": "La renta se paga igual se venda poco o mucho: es fija."}]}, {"id": "N6-L3", "num": 3, "title": "Ética contable y responsabilidad profesional", "objective": "Explicar por qué la honestidad es un requisito técnico de la contabilidad y qué conductas la rompen.", "explanation": ["La información contable sirve porque otros confían en ella: un banco presta, un socio invierte y un cliente paga sobre la base de esos números. Si los números se maquillan, todas esas decisiones se toman engañadas, y el daño no es solo moral: hay sanciones legales, fiscales y profesionales.", "La ética contable se resume en conductas concretas: registrar las operaciones reales, completas y en su periodo; no inflar ventas ni esconder deudas; no mezclar el dinero personal con el del negocio; guardar la confidencialidad de la información de los clientes y decir «no sé» o «eso no se puede» cuando una petición pide falsear información.", "En México, quien ejerce profesionalmente se rige además por códigos de ética de la profesión y por las Normas de Información Financiera. Para el estudiante, la regla práctica es simple: si un registro no podría explicarse abiertamente frente al dueño, al banco y a la autoridad, ese registro está mal."], "exampleTitle": "La venta que no existió", "exampleSteps": ["Para conseguir un préstamo, el dueño pide registrar en diciembre una venta grande que «seguramente» se hará en enero.", "Eso rompe la devengación y la honestidad del registro: en diciembre esa venta no ocurrió.", "La respuesta profesional: registrar en enero cuando ocurra, y entregar al banco información real, explicando las ventas esperadas como proyección, no como hecho."], "keyIdea": "La confianza es el producto de la contabilidad. Un número falso destruye el valor de todos los demás.", "commonError": "Creer que ayudar al cliente es hacer lo que pide aunque sea falsear cifras. Ayudar es protegerlo también de las consecuencias de un registro falso.", "activity": "Lee y valora cada caso con «correcto» o «incorrecto» y una razón: a) registrar una compra sin factura con una nota interna y decir que no hay comprobante; b) ocultar una deuda para mejorar el balance que verá el banco; c) negarse a registrar una venta ficticia y explicarlo por escrito al cliente; d) compartir la información de un cliente con otro negocio.", "quiz": [{"text": "Registrar en este mes una venta que ocurrirá el mes siguiente, para mejorar los números, es:", "options": ["Una práctica aceptable si luego sí se vende", "Incorrecto: viola la devengación y la honestidad del registro", "Obligatorio para conseguir préstamos", "Un ajuste normal de cierre"], "correct": 1, "feedback": "Las operaciones se registran cuando ocurren y como ocurrieron; anticiparlas falsea la información."}, {"text": "La confidencialidad en contabilidad significa:", "options": ["No llevar registros", "No revelar la información del cliente a terceros sin autorización", "No hablar con el cliente", "Guardar las facturas en casa"], "correct": 1, "feedback": "La información contable del cliente es reservada: solo se comparte con su autorización o por obligación legal."}]}, {"id": "N6-L4", "num": 4, "title": "Contabilidad electrónica y herramientas digitales en México", "objective": "Describir, en términos generales, la factura electrónica y la contabilidad electrónica, y cómo una aplicación ayuda a aprender y a registrar mejor.", "explanation": ["En México, la facturación se hace con comprobantes fiscales digitales por internet, conocidos como CFDI, que se emiten con los requisitos y por los medios que establece el SAT. La factura electrónica no es un PDF cualquiera: es un archivo con estructura y folio fiscal que la autoridad puede validar.", "La contabilidad electrónica consiste en llevar los registros en sistemas digitales y, para los contribuyentes obligados, enviar al SAT por el buzón tributario archivos como el catálogo de cuentas y la balanza de comprobación, conforme a las reglas vigentes. El detalle de quién está obligado y con qué periodicidad cambia por régimen y por disposiciones, por lo que debe verificarse siempre en fuentes oficiales.", "Para quien aprende, la tecnología no sustituye el razonamiento: un sistema carga y abona según se le configure, pero no sabe si la operación se clasificó bien. Por eso el orden de esta aplicación es el correcto: primero entender cuentas, partida doble y estados financieros, y después apoyarse en herramientas digitales que automatizan lo repetitivo sin esconder la lógica."], "exampleTitle": "Del cuaderno al sistema, sin perder la lógica", "exampleSteps": ["La tienda registra en un sistema su venta del día. El sistema genera el asiento: cargo a Bancos y abono a Ventas, y emite el CFDI correspondiente.", "Al fin de mes, el sistema suma el mayor, produce la balanza y arma los estados financieros con los mismos pasos del ciclo contable aprendido en el Nivel 3.", "El contador revisa lo que el sistema no puede juzgar: que la clasificación sea correcta y que no falte ningún documento."], "keyIdea": "Digitalizar no cambia la contabilidad: cambia la velocidad. La lógica —cuentas, partida doble, ciclo— sigue siendo la misma.", "commonError": "Confiar en que, por usar un sistema, los registros ya están bien. El sistema procesa lo que se le captura; una cuenta mal elegida produce estados financieros malos, solo que más rápido.", "activity": "Compara hacer a mano y en un sistema estas tareas: registrar 100 ventas, obtener el saldo de Clientes y armar la balanza del mes. Escribe para cada una qué automatiza la herramienta y qué sigue dependiendo del criterio de la persona.", "quiz": [{"text": "En México, la factura electrónica oficial se conoce como:", "options": ["Nota de remisión", "CFDI, emitido conforme a los requisitos del SAT", "Recibo en papel membretado", "Estado de cuenta bancario"], "correct": 1, "feedback": "El CFDI es el comprobante fiscal digital por internet con validez ante el SAT."}, {"text": "La principal ventaja de un sistema contable, sin perder la lógica aprendida, es que:", "options": ["Elimina la necesidad de entender la partida doble", "Automatiza registros repetitivos, sumas y reportes, mientras la clasificación sigue siendo responsabilidad de la persona", "Garantiza que no haya errores de criterio", "Sustituye por completo al contador en todos los casos"], "correct": 1, "feedback": "La herramienta da velocidad y orden; el juicio contable sigue siendo humano."}]}]}], "glossary": [{"term": "Activo", "definition": "Bienes y derechos que posee un negocio."}, {"term": "Activo circulante", "definition": "Activo que se convierte en dinero o se consume en menos de un año."}, {"term": "Abono", "definition": "Anotación en el Haber (lado derecho) de una cuenta."}, {"term": "Balanza de comprobación", "definition": "Lista de saldos del mayor que comprueba que los deudores igualan a los acreedores."}, {"term": "Capital contable", "definition": "Parte del activo que corresponde a los dueños: aportaciones más resultados acumulados."}, {"term": "Cargo", "definition": "Anotación en el Debe (lado izquierdo) de una cuenta."}, {"term": "Catálogo de cuentas", "definition": "Lista ordenada y codificada de las cuentas de un negocio."}, {"term": "CFDI", "definition": "Comprobante fiscal digital por internet; la factura electrónica en México."}, {"term": "Costo de ventas", "definition": "Costo de la mercancía vendida o del servicio prestado en un periodo."}, {"term": "Cuenta", "definition": "Registro donde se acumulan los movimientos de un mismo concepto."}, {"term": "Depreciación", "definition": "Distribución del costo de un activo fijo entre sus años de vida útil."}, {"term": "Devengación", "definition": "Registrar las operaciones cuando ocurren, no cuando se cobra o se paga."}, {"term": "Ecuación contable", "definition": "Activo = Pasivo + Capital."}, {"term": "Entidad económica", "definition": "Negocio distinto de su dueño para fines contables."}, {"term": "Gasto", "definition": "Erogación necesaria para operar, no atada a una venta específica."}, {"term": "Haber", "definition": "Lado derecho de una cuenta."}, {"term": "Ingreso", "definition": "Valor ganado por la actividad principal del negocio."}, {"term": "Inventario", "definition": "Mercancía disponible para la venta."}, {"term": "IVA acreditable", "definition": "IVA pagado en compras y gastos de la actividad, acreditable según las reglas vigentes."}, {"term": "IVA trasladado", "definition": "IVA cobrado a los clientes en las ventas."}, {"term": "Libro diario", "definition": "Registro cronológico de las operaciones."}, {"term": "Libro mayor", "definition": "Registro clasificado por cuenta de todos los movimientos."}, {"term": "Liquidez corriente", "definition": "Activo circulante entre pasivo circulante."}, {"term": "Margen de contribución", "definition": "Precio de venta menos costo variable por unidad."}, {"term": "NIF", "definition": "Normas de Información Financiera vigentes en México."}, {"term": "Partida doble", "definition": "Método en el que cada operación afecta al menos dos cuentas y los cargos igualan a los abonos."}, {"term": "Pasivo", "definition": "Obligaciones y deudas del negocio con terceros."}, {"term": "Punto de equilibrio", "definition": "Nivel de ventas donde no hay utilidad ni pérdida."}, {"term": "Saldo acreedor", "definition": /* ---------- Utilidades ---------- */
function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function ic(name, cls) { return '<span class="ms' + (cls ? " " + cls : "") + '" aria-hidden="true">' + name + '</span>'; }

function img(levelNum, lessonNum) { return "assets/n" + levelNum + "l" + lessonNum + ".webp"; }
function initials(name) { var p = String(name || "").trim().split(/\s+/).filter(Boolean); if (!p.length) return "TÚ"; return ((p[0][0] || "") + (p.length > 1 ? p[p.length - 1][0] : (p[0][1] || ""))).toUpperCase(); }
function firstName(name) { return String(name || "").trim().split(/\s+/)[0] || "alumno"; }
function capital(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
function pickIndex(n, avoid) { if (n < 2) return 0; var i; do { i = Math.floor(Math.random() * n); } while (i === avoid); return i; }
function required(lesson) { return Math.ceil(lesson.quiz.length * PASS_RATIO); }

var FLAT = [], BY_ID = {};
CONTENT.levels.forEach(function (level, li) {
  level.lessons.forEach(function (lesson, i) { var f = { level: level, lesson: lesson, levelIndex: li, lessonIndex: i, index: FLAT.length }; FLAT.push(f); BY_ID[lesson.id] = f; });
});
var TOTAL = FLAT.length;

var ACCOUNTS_KEY = "contaitscch-accounts", SESSION_KEY = "contaitscch-session";
function progressKey(email) { return "contaitscch-progress-" + email; }
function load(key, fallback) { try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : fallback; } catch (e) { return fallback; } }
function save(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {} }
function forget(key) { try { localStorage.removeItem(key); } catch (e) {} }
function mix(pw) { var h = 5381; for (var i = 0; i < pw.length; i++) h = ((h << 5) + h + pw.charCodeAt(i)) | 0; return "h" + (h >>> 0).toString(36); }
function emptyProgress() { return { lessons: {}, exam: { attempts: 0, best: null } }; }
function loadProgress(email) {
  var p = load(progressKey(email), null) || emptyProgress();
  p.lessons = p.lessons || {}; p.exam = p.exam || { attempts: 0, best: null };
  Object.keys(p.lessons).forEach(function (id) {   /* migra el formato anterior (solo puntaje) */
    var v = p.lessons[id];
    if (typeof v === "number") p.lessons[id] = { best: v, attempts: 1, passed: BY_ID[id] ? v >= required(BY_ID[id].lesson) : false };
  });
  return p;
}

function record(id) { return state.progress.lessons[id] || null; }
function isPassed(id) { var r = record(id); return !!(r && r.passed); }
function isFailedLast(id) { var r = record(id); return !!(r && !r.passed && r.attempts > 0); }
function passedCount() { return FLAT.filter(function (f) { return isPassed(f.lesson.id); }).length; }
function isUnlocked(i) { return i === 0 || isPassed(FLAT[i - 1].lesson.id); }
function nextFlat() { for (var i = 0; i < TOTAL; i++) if (!isPassed(FLAT[i].lesson.id)) return FLAT[i]; return null; }
function levelDone(li) { return CONTENT.levels[li].lessons.every(function (l) { return isPassed(l.id); }); }
function levelPassedCount(li) { return CONTENT.levels[li].lessons.filter(function (l) { return isPassed(l.id); }).length; }
function levelUnlocked(li) { return isUnlocked(FLAT.filter(function (f) { return f.levelIndex === li; })[0].index); }
function currentLevelIndex() { var n = nextFlat(); return n ? n.levelIndex : CONTENT.levels.length - 1; }
function examUnlocked() { return passedCount() === TOTAL; }
function examPassed() { return state.progress.exam.best != null && state.progress.exam.best >= EXAM_PASS; }

  var e = {}, nombre = (p.nombre || "").trim(), apellidos = (p.apellidos || "").trim(), email = (p.email || "").trim();
  if (nombre.length < 3) e.nombre = nombre ? "El nombre debe tener al menos 3 caracteres." : "Escribe tu nombre.";
  if (apellidos.length < 3) e.apellidos = apellidos ? "Los apellidos deben tener al menos 3 caracteres." : "Escribe tus apellidos.";
  if (email.length < 3) e.email = email ? "El correo debe tener al menos 3 caracteres." : "Escribe tu correo electrónico.";
  else if (email.indexOf("@") < 0) e.email = "El correo debe incluir @ (ej. nombre@itsch.edu.mx).";

var otpTimer = null;
function wireOtp() {
  var boxes = Array.prototype.slice.call(document.querySelectorAll("#otp input"));
  boxes.forEach(function (b, i) {
    b.addEventListener("input", function () { b.value = b.value.replace(/\D/g, "").slice(-1); if (b.value && boxes[i + 1]) boxes[i + 1].focus(); });
    b.addEventListener("keydown", function (e) { if (e.key === "Backspace" && !b.value && boxes[i - 1]) boxes[i - 1].focus(); });
    b.addEventListener("paste", function (e) {
      var t = (e.clipboardData || window.clipboardData).getData("text").replace(/\D/g, "").slice(0, 6);
      if (!t) return; e.preventDefault(); t.split("").forEach(function (c, k) { if (boxes[k]) boxes[k].value = c; });
      (boxes[t.length] || boxes[5]).focus();

  });
  boxes[0].focus();
  clearInterval(otpTimer);
  function tick() {
    var el = $("#otp-timer"); if (!el) { clearInterval(otpTimer); return; }
    var left = Math.max(0, Math.ceil((state.auth.resendAt - Date.now()) / 1000));
    if (left > 0) el.innerHTML = ic("schedule") + '<span>Reenviar en 00:' + String(left).padStart(2, "0") + '</span>';
    else { el.outerHTML = '<button type="button" class="timer" id="otp-timer" data-action="otp-resend">' + ic("send") + '<span>Reenviar código</span></button>'; clearInterval(otpTimer); }

function rankingEntries() {
  var list = DEMO_PEOPLE.map(function (d) {
    return { nombre: d.nombre, apellidos: d.apellidos, estado: d.estado, pais: d.pais, temas: d.temas, niveles: Math.floor(d.temas / 4), demo: true };

/* =====================================================================
   APRENDER: ruta de temas del nivel seleccionado
   ===================================================================== */
function viewAprender() {

  }).join("") + '</div>';
  h += '<section class="card mod-card"><div class="row1"><span class="eyebrow">' + ic(LEVEL_ICONS[li]) + 'Nivel ' + level.num + '</span><span class="chip">' + level.lessons.length + ' temas</span></div>' +

    return '<div class="node-wrap" style="left:' + pts[i].x + '%;top:' + pts[i].y + 'px">' + bubble +

        ' aria-label="Tema ' + lesson.num + ': ' + esc(lesson.title) + (d ? " (aprobado)" : retry ? " (por aprobar)" : u ? "" : " (bloqueado)") + '">' + icon + '</button>' +
      '<span class="node-label ' + (retry ? "retry" : cur ? "current" : u ? "" : "locked") + '">' + lesson.num + '. ' + esc(shortTitle(lesson.title)) + '</span></div>';
  }).join("");
  var isLast = li === CONTENT.levels.length - 1, ld = levelDone(li);

    '<button type="button" class="goal' + (ld ? " ready" : "") + '"' + (ld ? (isLast ? ' data-action="open-exam"' : ' data-action="route-level" data-level="' + (li + 1) + '"') : ' disabled') + ' aria-label="' + (isLast ? "Examen integrador final" : "Fin del Nivel " + level.num) + '">' +
      ic(isLast ? "workspace_premium" : ld ? "lock_open" : "flag", "fill") + (ld ? "" : '<span class="lk">' + ic("lock", "fill") + '</span>') + '</button>' +
    '<span class="goal-label"><b>' + ic("flag", "fill") + (isLast ? "Examen integrador final" : "Fin del Nivel " + level.num) + '</b>' +
      '<span>' + (ld ? (isLast ? "Toca para presentarlo" : "Toca para abrir el Nivel " + (level.num + 1)) : "Aprueba los 4 temas") + '</span></span></div>';
  h += '<section class="path" style="height:' + H + 'px" aria-label="Ruta de temas del Nivel ' + level.num + '">' + svg + nodes + goalHtml + '</section>';

function shortTitle(t) { var s = t.replace(/\s*\(.*?\)\s*/g, " ").trim(); var c = s.split(":")[0]; return c.length > 64 ? c.slice(0, 62).trim() + "…" : c; }

/* =====================================================================
   TEMA: 4 pasos (objetivo + infografía → explicación → ejemplo → repaso)
   ===================================================================== */
var STEP_NAMES = ["Objetivo", "Explicación", "Ejemplo resuelto", "Repaso del tema"];
function viewTema() {

    '<span class="count num">Paso ' + (step + 1) + ' de ' + nSteps + '</span></div>' +

    h += '<section class="card objective"><span class="icon-tile">' + ic("flag", "fill") + '</span><div><b>Cómo se aprueba este tema</b><p class="muted">Lee la explicación, revisa el ejemplo y el repaso, y resuelve el ejercicio de ' + L.quiz.length + ' preguntas. Necesitas ' + req + ' de ' + L.quiz.length + ' aciertos para desbloquear el siguiente tema.</p></div></section>';

/* =====================================================================
   EJERCICIO del tema y EXAMEN — mismo motor. Nunca se revela la opción
   correcta: solo se indica si la respuesta elegida fue correcta o no.
   ===================================================================== */
function startQuiz(kind, index) {
  var qs = kind === "exam" ? CONTENT.exam : FLAT[index].lesson.quiz;
  state.view = { kind: "quiz", mode: kind, index: index, qs: qs, q: 0, picked: null, checked: false, correct: 0 };
  render(); window.scrollTo(0, 0);
}
function viewQuiz() {
  var v = state.view, q = v.qs[v.q], exam = v.mode === "exam", f = exam ? null : FLAT[v.index], letters = "ABCD";
  var pct = (v.q + (v.checked ? 1 : 0)) / v.qs.length * 100;
  var h = '<header class="topbar"><div class="in pad">' +
    '<button type="button" class="icon-btn boxed" data-action="quit-quiz" aria-label="Salir">' + ic("close") + '</button>' +
    '<span class="step-txt">' + (exam ? "Examen integrador" : "Ejercicio · Tema " + f.lesson.num) + '</span>' +
    '<span class="count num">' + (v.q + 1) + ' de ' + v.qs.length + '</span></div>' +
    '<div class="pad topbar-progress">' + bar(pct, "amber thin") + '</div></header>';
  h += '<main class="pad no-tabs" style="padding-bottom:0">';
