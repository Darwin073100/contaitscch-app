  h += '<section class="card"><p class="q-text">' + esc(q.text) + '</p></section>';
  h += '<div class="opts" role="radiogroup" aria-label="Opciones de respuesta">' + q.options.map(function (o, i) {
    var cls = "";
    if (v.checked) cls = i === v.picked ? (i === q.correct ? "right" : "wrong") : "faded";
    else if (i === v.picked) cls = "sel";
    return '<button type="button" class="opt ' + cls + '" role="radio" aria-checked="' + (i === v.picked) + '" data-action="pick" data-i="' + i + '"' + (v.checked ? " disabled" : "") + '>' +
      '<span class="letter">' + letters[i] + '</span><span class="t">' + esc(o) + '</span>' +

  }).join("") + '</div>';
  h += '<div class="sticky-act">';

      '<p>' + (ok ? esc(q.feedback || "Bien razonado.") : (exam ? "Continúa con la siguiente pregunta." : "Al terminar el ejercicio podrás repasar el tema y volver a intentarlo.")) + '</p></section>';
    h += '<button type="button" class="btn navy" data-action="next-q">' + (last ? "Ver resultado" : "Siguiente pregunta") + ic("arrow_forward") + '</button>';
  } else {
    h += '<button type="button" class="btn primary" data-action="check"' + (v.picked == null ? " disabled" : "") + '>Comprobar</button>';

}
function finishQuiz() {

    var pb = state.progress.exam.best; state.progress.exam.best = pb == null ? score : Math.max(pb, score);

}
function termsHTML(q) {
  var list = CONTENT.glossary.filter(function (t) { return !q || (t.term + " " + t.definition).toLowerCase().indexOf(q) > -1; })
    .sort(function (a, b) { return a.term.localeCompare(b.term, "es"); });
  if (!list.length) return '<p class="empty">No hay términos que coincidan con “' + esc(q) + '”. Prueba con otra palabra.</p>';
  var groups = {}, order = [];
  list.forEach(function (t) { var L = t.term.charAt(0).toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); if (!groups[L]) { groups[L] = []; order.push(L); } groups[L].push(t); });
  return '<div class="terms">' + order.map(function (L) {
    return '<section class="letter-group"><h3>' + L + '</h3><div class="list">' + groups[L].map(function (t) { return '<div class="term"><b>' + esc(t.term) + '</b><p>' + esc(t.definition) + '</p></div>'; }).join("") + '</div></section>';
  }).join("") + '</div>';
}

  h += '<div class="menu">' +
    '<button type="button" data-action="open-about">' + ic("info", "c-accent") + '<span class="t">Conoce ' + APP + '</span>' + ic("chevron_right") + '</button>' +
    '<button type="button" data-action="tab" data-tab="glosario">' + ic("auto_stories", "c-accent") + '<span class="t">Glosario contable</span>' + ic("chevron_right") + '</button>' +
    '<button type="button" data-action="reset-ask">' + ic("restart_alt", "c-amber") + '<span class="t">Reiniciar mi avance</span>' + ic("chevron_right") + '</button>' +
    '<button type="button" class="danger" data-action="logout">' + ic("logout") + '<span class="t">Cerrar sesión</span></button></div>';
  h += '<p class="fine">Los temas fiscales de los Niveles 5 y 6 (IVA con tasa general de 16% e ISR en forma conceptual) son introductorios. Antes de usar la app de forma oficial, conviene que un contador los revise contra las disposiciones vigentes del SAT.</p>';
  return h;
}

/* =====================================================================
   CONOCE CONTAITSCCH
   ===================================================================== */
function viewAbout() {
  var h = '<header class="topbar"><div class="in pad"><button type="button" class="icon-btn" data-action="close-about" aria-label="Volver">' + ic("arrow_back") + '</button>' +
    '<span class="step-txt">Conoce ' + APP + '</span></div></header><main class="pad no-tabs">';
  h += '<section class="hero-card"><img src="assets/logo-icon.webp" alt="Logotipo de ' + APP + '"><h1>' + APP + '</h1><p class="slogan">' + SLOGAN + '</p>' +
    '<div class="feat"><div>' + ic("layers") + '6 niveles</div><div>' + ic("menu_book") + '24 temas</div><div>' + ic("task_alt") + 'Ejercicio por tema</div></div></section>';
  h += '<section class="card"><div class="tip"><span class="icon-tile">' + ic("school") + '</span><div class="body"><p class="t" style="font-size:18px;margin:0">¿Qué es ' + APP + '?</p></div></div>' +
    '<p class="muted" style="margin-top:12px">Es una aplicación para que la comunidad estudiantil aprenda contabilidad desde cero, de forma clara y gradual. El contenido avanza por 6 niveles; cada nivel tiene 4 temas y cada tema termina con un ejercicio. Todos los ejemplos usan negocios pequeños mexicanos: una papelería, una tienda, un taller, una cafetería.</p>' +
    '<div class="tags"><span>' + ic("balance") + 'Partida doble</span><span>' + ic("table_rows") + 'Cuentas T</span><span>' + ic("query_stats") + 'Estados financieros</span><span>' + ic("receipt_long") + 'IVA e ISR</span></div></section>';
  h += '<section><div class="sec-head" style="margin-bottom:12px"><h2>Cómo funciona</h2></div><div class="goal-list">' +
    goalItem("menu_book", "Estudia el tema", "Objetivo, explicación, ejemplo resuelto y repaso con la idea clave y el error común.") +
    goalItem("edit_note", "Resuelve el ejercicio", "Preguntas sobre lo que acabas de ver. La app te dice si acertaste, sin revelar la respuesta.") +
    goalItem("verified", "Aprueba para avanzar", "El siguiente tema se desbloquea al aprobar el ejercicio. Si no apruebas, vuelves a tomar la lección.") + '</div></section>';
  h += '<section class="card"><p class="eyebrow" style="margin-bottom:14px">Equipo y colaboradores</p><div class="goal-list">' +
    goalItem("apartment", "Institución de respaldo", "Instituto Tecnológico Superior · ITSCH, División de Contaduría Pública") +
    goalItem("history_edu", "Docencia y asesoría contable", "Validación curricular, reactivos y metodología") +
    goalItem("code", "Desarrollo y programación", "Arquitectura móvil y lógica de sesión") +
    goalItem("palette", "Diseño UI/UX", "Experiencia clara y accesible") + '</div></section>';
  h += '<button type="button" class="btn primary" data-action="close-about">Comenzar a estudiar' + ic("arrow_forward") + '</button></main>';
  return h;
}
function goalItem(icon, t, d) { return '<div class="callout card flat" style="padding:16px"><span class="icon-tile">' + ic(icon) + '</span><div class="txt"><b class="h">' + t + '</b><p>' + d + '</p></div></div>'; }

/* =====================================================================
   RENDER Y EVENTOS
   ===================================================================== */
function render() {
  var app = $("#app");
  if (!state.user) { renderAuth(); return; }
  var k = state.view.kind;
  if (k === "lesson") { app.innerHTML = viewTema(); return; }
  if (k === "quiz") { app.innerHTML = viewQuiz(); return; }
  if (k === "result") { app.innerHTML = viewResult(); return; }
  if (k === "about") { app.innerHTML = viewAbout(); return; }
  var body = state.tab === "aprender" ? viewAprender() : state.tab === "glosario" ? viewGlosario() : state.tab === "ranking" ? viewRanking() : state.tab === "perfil" ? viewPerfil() : viewNiveles();
  var bottomBar = state.tab === "aprender" ? continueBar() : state.tab === "ranking" ? rankBar() : "";
  app.innerHTML = topbar() + '<main class="pad"' + (bottomBar ? ' style="padding-bottom:210px"' : '') + '>' + body + '</main>' + bottomBar + tabbar();
  var s = $("#glossary-search");
  if (s) s.addEventListener("input", function () { state.glossaryQuery = s.value; $("#terms").innerHTML = termsHTML(s.value.trim().toLowerCase()); });
}
function go(tab) { state.tab = tab; state.view = { kind: "tabs" }; state.confirmReset = false; render(); window.scrollTo(0, 0); }
function openLesson(i) {
  if (!isUnlocked(i)) return;
  state.view = { kind: "lesson", index: i, step: 0, zoom: false }; state.routeLevel = FLAT[i].levelIndex; render(); window.scrollTo(0, 0);
}

document.addEventListener("submit", function (e) {
  e.preventDefault();
  if (e.target.id === "auth-form") submitAuth(); else if (e.target.id === "otp-form") submitOtp();
});
document.addEventListener("click", function (e) {
  var el = e.target.closest("[data-action]"); if (!el || el.disabled) return;
  var a = el.getAttribute("data-action"), v = state.view;
  if (a === "auth-mode") { state.auth = freshAuth(el.getAttribute("data-mode")); renderAuth(); }
  else if (a === "auth-back") { state.auth.step = 1; state.auth.error = ""; state.auth.errors = {}; renderAuth(); }
  else if (a === "otp-resend") { newCode(); state.auth.error = ""; renderAuth(); toast("Enviamos un código nuevo"); }
  else if (a === "tab") go(el.getAttribute("data-tab"));
  else if (a === "goto-level" || a === "back-route") { state.routeLevel = +el.getAttribute("data-level"); go("aprender"); }
  else if (a === "route-level") { state.routeLevel = +el.getAttribute("data-level"); if (state.view.kind !== "tabs" || state.tab !== "aprender") go("aprender"); else render(); }
  else if (a === "open-lesson") openLesson(+el.getAttribute("data-index"));
  else if (a === "close-lesson") { state.routeLevel = FLAT[v.index].levelIndex; go("aprender"); }
  else if (a === "step") { v.step = Math.max(0, Math.min(STEP_NAMES.length - 1, v.step + (+el.getAttribute("data-dir")))); render(); window.scrollTo(0, 0); }
  else if (a === "zoom") { v.zoom = true; render(); }
  else if (a === "unzoom") { if (e.target.tagName === "IMG") return; v.zoom = false; render(); }
  else if (a === "start-ejercicio") startQuiz("tema", v.index);
  else if (a === "open-exam") { if (examUnlocked()) startQuiz("exam", null); }
  else if (a === "pick") { if (v.checked) return; v.picked = +el.getAttribute("data-i"); render(); }
  else if (a === "check") { if (v.picked == null) return; v.checked = true; if (v.picked === v.qs[v.q].correct) v.correct++; render(); var fb = document.querySelector(".feedback"); if (fb) fb.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
  else if (a === "next-q") { if (v.q + 1 < v.qs.length) { v.q++; v.picked = null; v.checked = false; render(); window.scrollTo(0, 0); } else finishQuiz(); }
  else if (a === "quit-quiz") { if (v.mode === "exam") go("niveles"); else { state.view = { kind: "lesson", index: v.index, step: STEP_NAMES.length - 1, zoom: false }; render(); window.scrollTo(0, 0); } }
  else if (a === "next-tip") { state.tip = pickIndex(TIPS.length, state.tip); render(); }
  else if (a === "open-about") { state.view = { kind: "about", from: state.tab }; render(); window.scrollTo(0, 0); }
  else if (a === "close-about") go(v.from || "niveles");
  else if (a === "reset-ask") { state.confirmReset = true; render(); window.scrollTo(0, 0); }
  else if (a === "reset-cancel") { state.confirmReset = false; render(); }
  else if (a === "reset-yes") { state.progress = emptyProgress(); persist(); state.confirmReset = false; state.routeLevel = 0; render(); toast("Tu avance se reinició"); }
  else if (a === "logout") logout();
});
document.addEventListener("keydown", function (e) { if (e.key === "Escape" && state.view.kind === "lesson" && state.view.zoom) { state.view.zoom = false; render(); } });

(function init() {
  var email = load(SESSION_KEY, null), accounts = load(ACCOUNTS_KEY, {});
  if (email && accounts[email]) startSession(userFrom(email, accounts[email]));
  else render();
})();
</script>
