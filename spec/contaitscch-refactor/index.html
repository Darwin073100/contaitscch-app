<style>
/* Estructura de Stitch (columna móvil de 480px, botones táctiles, ruta de temas)
   con la paleta del HTML del cliente: azul marino para la marca, verde azulado
   para avanzar, ámbar para el tema actual. Claro y oscuro. */
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --surface-alt: #eef2f5;
  --surface-sunk: #ffffff;
  --line: #dde3e9;
  --text: #1a1a1a;
  --dim: #5b6b7a;
  --faint: #8d9aa6;
  --accent: #0e7c7b;
  --accent-ink: #ffffff;
  --accent-rim: #095756;
  --accent-tint: rgba(14, 124, 123, .10);
  --accent-soft: #7fd1d0;
  --navy: #0f2a44;
  --navy-ink: #ffffff;
  --navy-dim: rgba(255, 255, 255, .72);
  --navy-rim: #071a2c;
  --amber: #f2a900;
  --amber-ink: #0f2a44;
  --amber-rim: #b97f00;
  --amber-tint: rgba(242, 169, 0, .14);
  --amber-text: #8a5d00;
  --ok: #2e7d32;
  --ok-ink: #ffffff;
  --ok-tint: rgba(46, 125, 50, .10);
  --err: #c62828;
  --err-ink: #ffffff;
  --err-tint: rgba(198, 40, 40, .08);
  --title: #0f2a44;
  --bronze: #a8581c;
  --shadow: 0 1px 2px rgba(15, 42, 68, .06), 0 4px 14px rgba(15, 42, 68, .05);
  --scrim: rgba(11, 21, 32, .88);
  --font: "Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r-md: 12px; --r-lg: 14px; --r-xl: 20px;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1520; --surface: #122334; --surface-alt: #1a2f45; --surface-sunk: #0e1b2a; --line: #24405a;
    --text: #eef3f7; --dim: #9db0c0; --faint: #6f879c; --title: #eef3f7; --bronze: #e39a62;
    --accent: #2ba8a7; --accent-ink: #062423; --accent-rim: #1b7372; --accent-tint: rgba(43, 168, 167, .16); --accent-soft: #7fd1d0;
    --navy: #0a1e33; --navy-ink: #eef3f7; --navy-dim: rgba(238, 243, 247, .7); --navy-rim: #06121f;
    --amber: #f2a900; --amber-ink: #0b1520; --amber-rim: #a87400; --amber-tint: rgba(242, 169, 0, .16); --amber-text: #f2c14e;
    --ok: #66bb6a; --ok-ink: #0b1520; --ok-tint: rgba(102, 187, 106, .14);
    --err: #ef5350; --err-ink: #0b1520; --err-tint: rgba(239, 83, 80, .14);
    --shadow: none; --scrim: rgba(4, 10, 16, .9);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1520; --surface: #122334; --surface-alt: #1a2f45; --surface-sunk: #0e1b2a; --line: #24405a;
  --text: #eef3f7; --dim: #9db0c0; --faint: #6f879c; --title: #eef3f7; --bronze: #e39a62;
  --accent: #2ba8a7; --accent-ink: #062423; --accent-rim: #1b7372; --accent-tint: rgba(43, 168, 167, .16); --accent-soft: #7fd1d0;
  --navy: #0a1e33; --navy-ink: #eef3f7; --navy-dim: rgba(238, 243, 247, .7); --navy-rim: #06121f;
  --amber: #f2a900; --amber-ink: #0b1520; --amber-rim: #a87400; --amber-tint: rgba(242, 169, 0, .16); --amber-text: #f2c14e;
  --ok: #66bb6a; --ok-ink: #0b1520; --ok-tint: rgba(102, 187, 106, .14);
  --err: #ef5350; --err-ink: #0b1520; --err-tint: rgba(239, 83, 80, .14);
  --shadow: none; --scrim: rgba(4, 10, 16, .9);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--font); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--navy); }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
button:disabled { cursor: default; }
input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; border-radius: 10px; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; letter-spacing: -.01em; }
.num { font-variant-numeric: tabular-nums lining-nums; }
.ms {
  font-family: "Material Symbols Outlined"; font-weight: normal; font-style: normal;
  font-size: 22px; line-height: 1; letter-spacing: normal; text-transform: none;
  display: inline-block; white-space: nowrap; direction: ltr; flex: none;
  font-variation-settings: "FILL" 0, "wght" 500, "GRAD" 0, "opsz" 24;
  overflow: hidden; width: 1em; height: 1em; -webkit-font-smoothing: antialiased;
}
.ms.fill { font-variation-settings: "FILL" 1, "wght" 600, "GRAD" 0, "opsz" 24; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.c-accent { color: var(--accent); } .c-amber { color: var(--amber-text); } .c-dim { color: var(--dim); }

/* ---------- Estructura ---------- */
.shell { max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative; }
.pad { padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
main.pad { padding-block: 20px 120px; display: flex; flex-direction: column; gap: 22px; }
main.pad.no-tabs { padding-bottom: 40px; }

.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--navy); color: var(--navy-ink); }
.topbar .in { display: flex; align-items: center; gap: 10px; padding-block: 12px; min-height: 64px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
.brand img { width: 40px; height: 40px; border-radius: 11px; flex: none; }
.brand .bt { min-width: 0; }
.brand b { display: block; font-weight: 800; font-size: 17px; line-height: 1.2; letter-spacing: .01em; }
.brand small { display: block; font-size: 12px; font-weight: 700; color: var(--amber); line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.avatar-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--amber); color: var(--amber-ink); display: grid; place-items: center; font-weight: 800; font-size: 13px; flex: none; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex: none; color: inherit; }
.topbar .icon-btn:hover { background: rgba(255,255,255,.1); }
.icon-btn.boxed { background: rgba(255,255,255,.12); }
.topbar .step-txt { display: flex; align-items: center; gap: 8px; font-weight: 800; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .count { font-weight: 800; font-size: 14px; color: var(--navy-dim); flex: none; }
.topbar .bar { background: rgba(255,255,255,.16); }
.topbar-progress { padding-bottom: 12px; }

.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar .in { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 2px; font-size: 12px; font-weight: 600; color: var(--dim); position: relative; }
.tab .ms { font-size: 24px; }
.tab[aria-current="page"] { color: var(--accent); font-weight: 800; }
.tab[aria-current="page"] .ms { font-variation-settings: "FILL" 1, "wght" 600, "GRAD" 0, "opsz" 24; }
.tab[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 24%; right: 24%; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent); }

/* ---------- Componentes base ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-xl); padding: 20px; box-shadow: var(--shadow); }
.card.flat { box-shadow: none; }
.eyebrow { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.sec-head h2 { font-size: 21px; font-weight: 800; }
.sec-head span { font-size: 13px; font-weight: 700; color: var(--dim); white-space: nowrap; }
.muted { color: var(--dim); }
.small { font-size: 13px; }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 11.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; background: var(--surface-alt); color: var(--dim); white-space: nowrap; }
.chip .ms { font-size: 15px; }
.chip.accent { background: var(--accent-tint); color: var(--accent); }
.chip.navy { background: var(--navy); color: var(--navy-ink); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 56px; padding: 0 22px; border-radius: var(--r-lg); width: 100%;
  font-weight: 800; font-size: 17px; letter-spacing: .01em;
  border-bottom: 4px solid transparent; transition: transform .08s, border-bottom-width .08s, filter .15s;
}
.btn:not(:disabled):active { transform: translateY(3px); border-bottom-width: 1px; }
.btn:not(:disabled):hover { filter: brightness(1.06); }
.btn .ms { font-size: 22px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-bottom-color: var(--accent-rim); }
.btn.navy { background: var(--navy); color: var(--navy-ink); border-bottom-color: var(--navy-rim); }
.btn.amber { background: var(--amber); color: var(--amber-ink); border-bottom-color: var(--amber-rim); }
.btn.danger { background: var(--err); color: var(--err-ink); border-bottom-color: var(--err); filter: brightness(.95); }
.btn.ghost { background: var(--surface); color: var(--text); border: 2px solid var(--line); border-bottom-width: 4px; }
.btn.ghost:not(:disabled):active { border-bottom-width: 2px; }
.btn:disabled { background: var(--surface-alt); color: var(--faint); border-bottom-color: var(--line); }
.btn.sq { width: 64px; padding: 0; flex: none; }
.btn.sm { min-height: 44px; font-size: 15px; padding: 0 16px; border-bottom-width: 3px; width: auto; }
.link { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; color: var(--accent); padding: 10px 4px; justify-content: center; }
.btn-row { display: flex; gap: 12px; }
.actions { display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }

.bar { height: 12px; border-radius: 999px; background: var(--surface-alt); overflow: hidden; position: relative; }
.bar.thin { height: 8px; }
.bar > i { display: block; height: 100%; border-radius: inherit; background: var(--accent); transition: width .5s ease; }
.bar.amber > i { background: var(--amber); }
.bar-meta { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; font-weight: 700; margin-top: 10px; }

/* ---------- Acceso ---------- */
.auth-band { background: var(--navy); color: var(--navy-ink); padding-block: 20px 76px; }
.auth-band .chip { background: rgba(255,255,255,.12); color: var(--navy-ink); }
.auth { display: flex; flex-direction: column; gap: 20px; padding-block: 0 40px; margin-top: -56px; }
.auth-hero { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 18px; }
.logo-ring { position: relative; width: 112px; height: 112px; }
.logo-ring img { width: 100%; height: 100%; border-radius: 28px; object-fit: cover; display: block; }
.logo-ring .badge { position: absolute; right: -8px; bottom: -8px; width: 38px; height: 38px; border-radius: 50%; background: var(--amber); color: var(--amber-ink); display: grid; place-items: center; border: 4px solid var(--navy); }
.auth-hero h1 { font-size: 28px; line-height: 1.15; font-weight: 800; margin-top: 6px; }
.auth-hero p { color: var(--navy-dim); max-width: 34ch; }
.auth-hero p.slogan { color: var(--amber); font-weight: 800; font-size: 14px; }
.stepper { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--surface-alt); padding: 6px; border-radius: var(--r-lg); }
.stepper div { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; border-radius: 10px; font-weight: 700; color: var(--dim); }
.stepper div i { font-style: normal; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); font-size: 13px; }
.stepper div i .ms { font-size: 16px; }
.stepper div.on { background: var(--navy); color: var(--navy-ink); }
.stepper div.on i { background: var(--amber); color: var(--amber-ink); }
.stepper div.ok i { background: var(--accent); color: var(--accent-ink); }
.form { display: flex; flex-direction: column; gap: 14px; }
.field label { display: block; font-size: 13px; font-weight: 700; color: var(--dim); margin-bottom: 6px; }
.input-wrap { display: flex; align-items: center; gap: 10px; background: var(--surface-sunk); border: 2px solid var(--line); border-radius: 12px; padding: 0 14px; min-height: 54px; transition: border-color .15s; }
.input-wrap:focus-within { border-color: var(--accent); }
.input-wrap .ms { color: var(--faint); }
.input-wrap input { flex: 1; min-width: 0; background: none; border: 0; outline: none; font-size: 16px; min-height: 50px; }
.input-wrap input::placeholder { color: var(--faint); }
.form-error { display: flex; gap: 8px; align-items: flex-start; color: var(--err); font-size: 14px; font-weight: 600; background: var(--err-tint); border-radius: 12px; padding: 10px 12px; }
.verify-head { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.verify-icon { width: 84px; height: 84px; border-radius: 50%; background: var(--accent-tint); color: var(--accent); display: grid; place-items: center; }
.verify-icon .ms { font-size: 42px; }
.verify-head h2 { font-size: 22px; font-weight: 800; }
.otp { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.otp input { width: 100%; aspect-ratio: 4 / 5; max-width: 100%; text-align: center; font-size: 24px; font-weight: 800; background: var(--surface-sunk); border: 2px solid var(--line); border-radius: 12px; outline: none; }
.otp input:focus { border-color: var(--accent); }
.demo-code { display: flex; gap: 10px; align-items: center; background: var(--amber-tint); color: var(--amber-text); border-radius: 12px; padding: 10px 12px; font-size: 13.5px; font-weight: 600; }
.demo-code b { font-size: 16px; letter-spacing: .18em; }
.timer { align-self: center; display: inline-flex; gap: 6px; align-items: center; background: var(--surface-alt); border-radius: 999px; padding: 8px 16px; font-weight: 700; font-size: 14px; }
.auth-switch { text-align: center; display: flex; flex-direction: column; gap: 2px; color: var(--dim); }
.auth-switch button { font-weight: 800; color: var(--accent); display: inline-flex; gap: 6px; align-items: center; justify-content: center; padding: 6px; }
.perks { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px 4px; }
.perks div { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; text-align: center; color: var(--dim); padding: 0 6px; }
.perks div + div { border-left: 1px solid var(--line); }
.perks .ms { font-size: 26px; color: var(--accent); }

/* ---------- Inicio / Niveles ---------- */
.hello { display: flex; flex-direction: column; gap: 4px; }
.hello h1 { font-size: 26px; font-weight: 800; line-height: 1.2; color: var(--title); }
.hello p { color: var(--dim); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; box-shadow: var(--shadow); }
.stat .ms { font-size: 24px; color: var(--accent); }
.stat b { display: block; font-size: 17px; font-weight: 800; line-height: 1.15; overflow-wrap: anywhere; }
.stat small { display: block; font-size: 12px; color: var(--dim); font-weight: 600; line-height: 1.3; }
.prog-card .top { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.icon-tile { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; flex: none; background: var(--accent-tint); color: var(--accent); }
.icon-tile.amber { background: var(--amber-tint); color: var(--amber-text); }
.icon-tile.navy { background: var(--navy); color: var(--navy-ink); }
.icon-tile.solid { background: var(--accent); color: var(--accent-ink); }
.icon-tile.locked { background: var(--surface-alt); color: var(--faint); }
.icon-tile.err { background: var(--err-tint); color: var(--err); }
.icon-tile.big { width: 56px; height: 56px; border-radius: 16px; }
.icon-tile.big .ms { font-size: 30px; }
.prog-card h3 { font-size: 17px; font-weight: 800; line-height: 1.25; }
.prog-card .pct { margin-left: auto; font-size: 26px; font-weight: 800; color: var(--accent); }

.next-card { background: var(--navy); color: var(--navy-ink); }
.next-card .eyebrow { color: var(--amber); }
.next-card .t { font-size: 19px; font-weight: 800; line-height: 1.3; margin: 6px 0 16px; }

.tip { display: flex; gap: 14px; align-items: flex-start; }
.tip .body { min-width: 0; flex: 1; }
.tip .body p.t { font-weight: 700; font-size: 16px; line-height: 1.4; margin-top: 4px; }
.tip .body p.d { color: var(--dim); font-size: 14px; margin-top: 6px; }
.tip .icon-btn { color: var(--dim); background: var(--surface-alt); }

.levels { display: flex; flex-direction: column; gap: 14px; }
.level { display: flex; flex-direction: column; gap: 14px; }
.level .head { display: flex; gap: 14px; align-items: flex-start; }
.level .head .txt { min-width: 0; flex: 1; }
.level .head .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; font-size: 13px; font-weight: 600; color: var(--dim); }
.level h3 { font-size: 20px; font-weight: 800; line-height: 1.2; color: var(--title); }
.level .sub { color: var(--dim); font-size: 15px; margin-top: 2px; }
.level .state-ic { color: var(--faint); }
.level .state-ic.ok { color: var(--accent); }
.level .desc { font-size: 14.5px; color: var(--dim); }
.level.locked { background: var(--surface-alt); box-shadow: none; }
.level.locked h3, .level.locked .sub { color: var(--faint); }
.level.locked .desc { display: none; }
.lock-note { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; font-weight: 600; color: var(--amber-text); }
.lock-note .ms { font-size: 20px; }

.about-row { display: flex; align-items: center; gap: 14px; text-align: left; width: 100%; }
.about-row .txt { min-width: 0; flex: 1; }
.about-row b { font-size: 16.5px; font-weight: 800; display: block; }
.about-row .d { font-size: 14px; color: var(--dim); display: block; }
.round-go { width: 44px; height: 44px; border-radius: 50%; background: var(--surface-alt); display: grid; place-items: center; flex: none; }

/* ---------- Ruta (Aprender) ---------- */
.lv-tabs { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; margin-inline: calc(var(--gutter-l) * -1) calc(var(--gutter-r) * -1); padding-inline: var(--gutter-l) var(--gutter-r); }
.lv-tabs::-webkit-scrollbar { display: none; }
.lv-tab { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); border-bottom-width: 3px; font-weight: 700; font-size: 14px; color: var(--dim); }
.lv-tab .ms { font-size: 17px; }
.lv-tab[aria-pressed="true"] { background: var(--navy); color: var(--navy-ink); border-color: var(--navy-rim); }
.lv-tab.done .ms { color: var(--accent); }
.lv-tab[aria-pressed="true"].done .ms { color: var(--accent-soft); }
.mod-card { background: var(--navy); color: var(--navy-ink); }
.mod-card .eyebrow { display: flex; align-items: center; gap: 6px; color: var(--amber); }
.mod-card .chip { background: rgba(255,255,255,.12); color: var(--navy-ink); }
.mod-card h2 { font-size: 21px; font-weight: 800; line-height: 1.25; margin-top: 6px; }

/* ---------- Tema ---------- */

<script>
"use strict";
/* =====================================================================
   CONTAITSCCH — Ruta de aprendizaje por niveles (6 niveles · 24 temas).
   Cada tema se recorre en 4 pasos y termina con su ejercicio.
   Regla de avance: el siguiente tema se desbloquea solo cuando se
   aprueba el ejercicio del tema actual. Si no se aprueba, el alumno
   vuelve a tomar la lección completa. La app nunca muestra cuál era
   la respuesta correcta.
   Versión estática: cuentas y avance se guardan en este navegador
